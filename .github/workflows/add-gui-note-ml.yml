name: Add Gui note to ML slide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-gui-note-ml.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch presentation note
        shell: python
        run: |
          from pathlib import Path
          path = Path('apresentacao-final/index.html')
          text = path.read_text(encoding='utf-8')
          if '.speaker-note{' not in text:
              text = text.replace(".sl[data-k='lunch'] .name,.sl[data-k='lunch'] .num{display:none}</style>", ".sl[data-k='lunch'] .name,.sl[data-k='lunch'] .num{display:none}.speaker-note{position:absolute;right:68px;top:66px;z-index:32;font-size:23px;font-weight:800;letter-spacing:.02em;color:rgba(255,255,255,.38);background:rgba(0,0,0,.28);border:1px solid rgba(255,216,61,.18);border-radius:999px;padding:9px 15px;text-shadow:0 2px 8px #000}</style>")
          text = text.replace("final-slides-20-21-22-20260925", "final-slides-20-21-22-note-20260925")
          old = "<div class=\"frame\"></div>${i===0?'<div class=\"mist\"></div><div class=\"beam l\"></div><div class=\"beam r\"></div>':''}<div class=\"name\">${s.label}</div>"
          new = "<div class=\"frame\"></div>${s.id==='ml'?'<div class=\"speaker-note\">(ex: kit de buxinho com 10)</div>':''}${i===0?'<div class=\"mist\"></div><div class=\"beam l\"></div><div class=\"beam r\"></div>':''}<div class=\"name\">${s.label}</div>"
          if new not in text:
              if old not in text:
                  raise SystemExit('Trecho do slide não encontrado')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apresentacao-final/index.html
          git commit -m 'Adiciona lembrete discreto no slide Mercado Livre' || exit 0
          git push
