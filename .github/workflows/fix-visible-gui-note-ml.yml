name: Fix visible Gui note on ML slide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-visible-gui-note-ml.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make note visible
        shell: python
        run: |
          from pathlib import Path
          path = Path('apresentacao-final/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('final-slides-20-21-22-note-20260925', 'final-slides-20-21-22-note-visible-20260925')
          text = text.replace('final-slides-20-21-22-20260925', 'final-slides-20-21-22-note-visible-20260925')
          old_css = ".speaker-note{position:absolute;right:68px;top:66px;z-index:32;font-size:23px;font-weight:800;letter-spacing:.02em;color:rgba(255,255,255,.38);background:rgba(0,0,0,.28);border:1px solid rgba(255,216,61,.18);border-radius:999px;padding:9px 15px;text-shadow:0 2px 8px #000}"
          new_css = ".speaker-note{position:absolute;right:74px;top:96px;z-index:80;font-size:28px;font-weight:900;letter-spacing:.01em;color:#ffd83d;background:rgba(0,0,0,.72);border:2px solid rgba(255,216,61,.65);border-radius:999px;padding:12px 22px;text-shadow:0 2px 10px #000;box-shadow:0 0 22px rgba(255,216,61,.18)}"
          if old_css in text:
              text = text.replace(old_css, new_css)
          elif '.speaker-note{' in text:
              start = text.index('.speaker-note{')
              end = text.index('}', start) + 1
              text = text[:start] + new_css + text[end:]
          else:
              text = text.replace(".sl[data-k='lunch'] .name,.sl[data-k='lunch'] .num{display:none}</style>", ".sl[data-k='lunch'] .name,.sl[data-k='lunch'] .num{display:none}" + new_css + "</style>")
          old = "<div class=\"frame\"></div>${i===0?'<div class=\"mist\"></div><div class=\"beam l\"></div><div class=\"beam r\"></div>':''}<div class=\"name\">${s.label}</div>"
          new = "<div class=\"frame\"></div>${s.id==='ml'?'<div class=\"speaker-note\">ex: kit de buxinho com 10</div>':''}${i===0?'<div class=\"mist\"></div><div class=\"beam l\"></div><div class=\"beam r\"></div>':''}<div class=\"name\">${s.label}</div>"
          if 'kit de buxinho com 10' not in text:
              if old not in text:
                  raise SystemExit('Trecho do slide não encontrado')
              text = text.replace(old, new)
          text = text.replace('(ex: kit de buxinho com 10)', 'ex: kit de buxinho com 10')
          path.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apresentacao-final/index.html
          git commit -m 'Ajusta lembrete visível no slide Mercado Livre' || exit 0
          git push
