name: Refinar copy landing PRO

on:
  push:
    paths:
      - '.github/workflows/patch-landing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar nova copy persuasiva
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def sub_section(pattern, replacement, label):
              global s
              new_s, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Não consegui alterar: {label} ({n})')
              s = new_s

          # HERO — qualifica o seller e posiciona a promessa sem exagero.
          sub_section(
              r'<section class="hero" id="top">.*?</section>',
              '''<section class="hero" id="top"><div class="hero-bg"><img src="images/hero.jpg" width="1365" height="2048" fetchpriority="high" alt="Gui Nonato na Imersão Ecommerce"></div><div class="shell"><div class="hero-inner"><p class="eyebrow">Imersão Ecommerce • Mercado Livre PRO</p><h1>Sua operação já vende. <strong>Agora ela precisa estar preparada para escalar.</strong></h1><p class="lead">Um dia presencial para sellers que querem tomar melhores decisões sobre <b>produto, margem, estoque, anúncios, importação, dados, caixa e escala</b> — com aplicação prática na própria operação.</p><div class="event-main"><div class="event-box"><b>26 SET 2026</b><span>A partir das 9h30</span></div><div class="event-box"><b>TATUAPÉ - SÃO PAULO</b><span>Evento presencial</span></div></div><div class="hero-facts"><span>Apenas 50 participantes</span><span>Conteúdo avançado</span><span>Análises ao vivo</span></div><div class="micro"><span>Operações reais</span><span>•</span><span>Plano de ação para os próximos 90 dias</span><span>•</span><span>Coffee break e networking</span></div></div></div></section>''',
              'hero'
          )

          # CONTEÚDO — transforma a seção em entregáveis claros.
          sub_section(
              r'<section class="section content-intro" id="conteudo">.*?</section>',
              '''<section class="section content-intro" id="conteudo"><div class="shell"><div class="content-top"><div class="content-pitch"><p class="eyebrow">Você sai com</p><h2>Menos teoria.<br><strong>Mais direção para escalar.</strong></h2><p>A ideia não é você sair inspirado. É voltar para a operação sabendo <b>o que fazer, por que fazer e o que priorizar primeiro.</b></p></div><div class="topic-list"><article class="topic-row"><h3>Mapa da escala</h3><p>Entenda o que muda entre <b>R$10K, R$100K, R$500K e R$1M/mês</b> — e os gargalos que aparecem em cada estágio.</p></article><article class="topic-row"><h3>Plano de 90 dias</h3><p>Defina o que <b>escalar, corrigir, pausar ou priorizar</b> quando voltar para a sua operação.</p></article><article class="topic-row"><h3>Produto + margem + capital</h3><p>Descubra onde seu dinheiro está trabalhando e onde está ficando preso. <b>Custos, taxas, frete, impostos e anúncios na mesa.</b></p></article><article class="topic-row"><h3>Importação na prática</h3><p>Fornecedor, custo, negociação, impostos e logística — inclusive <b>quando importar e quando não colocar o caixa em risco.</b></p></article><article class="topic-row"><h3>Mercado Livre + dados</h3><p>Anúncios, conversão, catálogo, reputação, posicionamento e Nubimetrics para saber <b>o que corrigir, escalar ou cortar.</b></p></article><article class="topic-row"><h3>IA na operação</h3><p>Como usar IA como uma ferramenta prática de análise e execução — <b>não só como geradora de texto.</b></p></article><article class="topic-row"><h3>Hot seats ao vivo</h3><p>Análises de operações reais para identificar <b>gargalos, dinheiro perdido e a primeira decisão que precisa ser tomada.</b></p></article></div></div></div></section>''',
              'conteúdo'
          )

          # PARA QUEM — qualifica sem repetir demais.
          sub_section(
              r'<section class="section" id="para-quem">.*?</section>',
              '''<section class="section" id="para-quem"><div class="shell"><div class="heading"><p class="eyebrow">Para quem é a Imersão PRO</p><h2>Para quem já está no jogo e quer chegar ao próximo nível.</h2><p>Essa imersão foi criada principalmente para quem já vende, já colocou dinheiro na operação e agora precisa fazer esse dinheiro trabalhar melhor.</p></div><div class="identify"><article><b>Já vende no Mercado Livre.</b><span>Tem produtos e uma operação rodando.</span></article><article><b>Fatura, mas a margem não acompanha.</b><span>Vende mais e sente que sobra menos do que deveria.</span></article><article><b>Não sabe onde colocar capital.</b><span>Precisa decidir melhor quais produtos escalar, cortar ou comprar.</span></article><article><b>A operação cresceu e ficou mais complexa.</b><span>Estoque, caixa, anúncios e estrutura começaram a cobrar decisões melhores.</span></article><article><b>Quer importar com mais inteligência.</b><span>Busca margem na origem sem colocar o caixa em risco.</span></article><article><b>Sente que o mercado está mudando rápido.</b><span>IA, dados e novas ferramentas já estão mudando a forma de operar.</span></article></div><p style="margin:26px 0 0;color:#9d978e"><b style="color:#eee9e0">Não é uma aula básica de como fazer a primeira venda.</b> O foco do presencial é quem quer analisar operação, tomar decisões e construir o próximo estágio de crescimento.</p></div></section>''',
              'para quem'
          )

          # AUTORIDADE — leva a transformação do Gui para mais cedo e conecta com decisões.
          sub_section(
              r'<section class="section dark"><div class="shell editorial">.*?</section>',
              '''<section class="section dark"><div class="shell editorial"><div class="media"><figure><img src="images/operation.jpg" loading="lazy" alt="Operação real de ecommerce"></figure><figure><img src="images/stage.jpg" loading="lazy" alt="Gui Nonato conduzindo conteúdo"></figure></div><div><p class="eyebrow">De cerca de R$500 mil para +R$3 milhões/mês</p><h2>Estratégia construída dentro de uma operação real.</h2><p>Essa imersão não nasceu da teoria. Gui Nonato vai abrir as decisões, processos e aprendizados de uma operação que hoje processa <b>+30 mil pedidos por mês</b> e já ultrapassou <b>R$200 milhões em vendas</b>.</p><p>Você vai entender como <b>produto, custo, importação, margem, estoque, preço, anúncios, dados e operação</b> precisam se conectar para crescer sem transformar escala em mais caos, capital preso e margem em pó.</p></div></div></section>''',
              'autoridade'
          )

          # EXPERIÊNCIA — explica por que o presencial importa.
          sub_section(
              r'<section class="experience">.*?</section>',
              '''<section class="experience"><img src="images/audience.jpg" loading="lazy" alt="Participantes em evento presencial"><div class="shell experience-copy"><p class="eyebrow">Por que presencial?</p><h2>Informação você encontra online.<br>Visão externa, não.</h2><p>Na sala você vai ouvir problemas reais, comparar decisões, fazer perguntas e entender como outros sellers estão lidando com <b>estoque, margem, produto, anúncios e capital</b>.</p><p><b>Você pode perceber em algumas horas um gargalo que sozinho levaria meses para enxergar.</b></p></div></section>''',
              'experiência'
          )

          # BÔNUS — mantém valor sem deslocar o posicionamento PRO.
          sub_section(
              r'<section class="section"><div class="shell bonus">.*?</section>',
              '''<section class="section"><div class="shell bonus"><div><p class="bonus-kicker">🎁 BÔNUS EXCLUSIVO</p><h2>Treinamento online Renda Livre.</h2><p>Mais de <b>30 horas de aulas gravadas</b>, avaliado em R$197, para reforçar fundamentos e chegar ao presencial ainda mais preparado — ou compartilhar com alguém da equipe que precisa dominar a base.</p></div><div class="bonus-price"><span>Valor do treinamento online</span><s>R$ 197</s><strong>GRÁTIS</strong><small>para participantes da imersão</small></div></div></section>''',
              'bônus'
          )

          # PREÇO — reforça valor do duplo e entregáveis do presencial.
          sub_section(
              r'<section class="section dark" id="ingressos">.*?</section>',
              '''<section class="section dark" id="ingressos"><div class="shell"><div class="heading center"><p class="eyebrow">Investimento</p><h2>Um dia inteiro para tomar decisões melhores sobre a sua operação.</h2><p>50 pessoas na sala de propósito: mais espaço para interação, perguntas, análises e networking de verdade.</p></div><div class="price-grid"><article class="price-card"><p class="eyebrow">Individual</p><h3>1 participante</h3><div class="price">R$ 257</div><ul><li>Um dia completo de evento presencial</li><li>Hot seats e análises ao vivo</li><li>Networking e perguntas diretamente com o Gui</li><li>Coffee break</li><li>Treinamento Renda Livre com +30h de aulas</li></ul><a class="btn ghost checkout" href="https://pay.kiwify.com.br/SLCUydd" target="_blank" rel="noopener">Garantir minha vaga →</a></article><article class="price-card featured"><span class="badge">Melhor custo-benefício</span><p class="eyebrow">Duplo</p><h3>2 participantes</h3><div class="price">R$ 297</div><p><b>Por apenas R$40 a mais, leve seu sócio ou alguém da equipe.</b></p><p style="color:#a9a39a;font-size:13px">Porque voltar cheio de decisões para implementar é muito mais fácil quando quem executa com você também estava na sala.</p><ul><li>2 acessos ao evento presencial</li><li>Hot seats e análises ao vivo</li><li>Networking e perguntas diretamente com o Gui</li><li>Coffee break</li><li>Treinamento Renda Livre com +30h de aulas</li></ul><a class="btn primary checkout" href="https://pay.kiwify.com.br/SLCUydd" target="_blank" rel="noopener">Garantir 2 ingressos →</a></article></div><div class="secure"><div class="secure-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg><div><b>Pagamento processado pela Kiwify</b><span>Checkout externo para finalizar a compra.</span></div></div><div class="secure-box"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg><div><b>PIX ou cartão de crédito</b><span>Cartão com opção de parcelamento em até 12x.</span></div></div></div><div class="whatsapp-choice"><a class="btn whatsapp-buy" href="https://wa.me/5511923990244?text=Olá!%20Quero%20comprar%20meu%20ingresso%20para%20a%20Imersão%20Ecommerce." target="_blank" rel="noopener">Comprar pelo WhatsApp</a><a class="whatsapp-help" href="https://wa.me/5511923990244?text=Olá!%20Ainda%20tenho%20algumas%20dúvidas%20sobre%20a%20Imersão%20Ecommerce." target="_blank" rel="noopener">Ainda tenho dúvidas, quero falar com a equipe</a></div></div></section>''',
              'ingressos'
          )

          # FAQ — alinha expectativa sobre iniciantes sem excluir quem já compraria pelo bônus.
          s = s.replace(
              '<details><summary>O evento serve para iniciantes?</summary><p>Sim. Ao garantir sua vaga, você recebe de presente o <b>treinamento online Renda Livre</b>, com mais de 30 horas de aulas gravadas. Assim, você já pode começar a estudar e aplicar os principais conceitos antes do evento, chegar mais preparado e aproveitar a imersão muito melhor, mesmo que ainda esteja começando no Mercado Livre.</p></details>',
              '<details><summary>O evento serve para iniciantes?</summary><p>O conteúdo presencial é principalmente voltado para quem <b>já vende e já tem uma operação rodando</b>. Quem está começando também recebe o treinamento online Renda Livre, com mais de 30 horas de aulas gravadas, para construir a base e chegar mais preparado ao evento.</p></details>'
          )

          # CTA FINAL — mais específico para o seller.
          sub_section(
              r'<section class="final">.*?</section>',
              '''<section class="final"><div class="shell"><p class="eyebrow">26/09/2026 • Tatuapé, São Paulo • 50 vagas</p><h2>Saia do modo automático e descubra onde atacar primeiro na sua operação.</h2><p>Você não sai com mais teoria. Sai sabendo o que fazer, por que fazer e quais decisões priorizar nos próximos 90 dias.</p><div class="actions" style="justify-content:center"><a class="btn primary checkout" href="https://pay.kiwify.com.br/SLCUydd" target="_blank" rel="noopener">Garantir minha vaga →</a></div></div></section>''',
              'cta final'
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Salvar ajustes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refina copy para sellers e escala"
          git push
