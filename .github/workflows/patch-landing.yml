name: Adicionar Hub ARGO na landing

on:
  push:
    paths:
      - '.github/workflows/patch-landing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python patch-argo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adiciona seção Hub ARGO na landing"
          git push
