name: Update final presentation slides 20 21 22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-final-slides-20-21-22.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch apresentacao-final slide list
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('apresentacao-final/index.html')
          text = p.read_text(encoding='utf-8')
          old = "['imersao18','18.jpg','Imersão'],['mentoria','Apresentação A - Gui Nonato (16).jpg','Mentoria'],['qr','Apresentação A - Gui Nonato (19).jpg','QR Code']"
          new = "['imersao18','18.jpg','Imersão'],['mentoria','Apresentação A - Gui Nonato (20).jpg','Mentoria'],['qr','Apresentação A - Gui Nonato (21).jpg','QR Code'],['final22','Apresentação A - Gui Nonato (22).jpg','Final']"
          if new not in text:
              if old not in text:
                  raise SystemExit('Trecho antigo não encontrado; não alterei para evitar mexer na versão errada.')
              text = text.replace(old, new)
          text = text.replace("const V='final-almoco-90min-20260923'", "const V='final-slides-20-21-22-20260925'")
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apresentacao-final/index.html
          git commit -m 'Atualiza slides finais 20 21 22' || exit 0
          git push
