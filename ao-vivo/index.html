<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta name="theme-color" content="#000000">
<title>Imersão Ecommerce — AO VIVO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
#stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}
.slide.on{display:flex}
.slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:10px;opacity:.08;transition:.2s}
body:hover .controls{opacity:1}
button{border:1px solid #444;background:#111;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}
button.primary{background:#ffd83d;color:#000;border-color:#ffd83d}
.counter{position:fixed;right:18px;bottom:18px;z-index:15;color:#ffffff88;font-size:13px}
.market{width:min(1500px,90vw);padding:54px;border:1px solid #5a4a16;background:#090909}
.market h1{font-size:48px;margin:0 0 32px;color:#ffd83d}.market-row{display:grid;grid-template-columns:280px 1fr 180px;gap:22px;align-items:center;padding:18px 0;border-bottom:1px solid #222;font-size:26px;font-weight:800}.track{height:22px;background:#222;border-radius:99px;overflow:hidden}.fill{height:100%;background:#ffd83d}
.lunch{text-align:center}.lunch h1{font-size:88px;margin:0 0 40px}.lunch h1 span{color:#ffd83d}.timer{font-size:150px;font-weight:900;color:#ffd83d;border:2px solid #ffd83d;border-radius:28px;padding:28px 60px;min-width:850px}
.note{position:absolute;right:50px;top:50px;background:#111;border:2px solid #ffd83d;color:#ffd83d;border-radius:999px;padding:12px 20px;font-size:24px;font-weight:900}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:40px;color:#fff;background:#111;font-size:28px;z-index:10}
</style>
</head>
<body>
<div id="stage"></div>
<div class="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button></div>
<div class="counter" id="counter"></div>
<script>
const A='/Evento/apresentacao/assets/';
const slides=[
['img','1.jpg'],['img','2.jpg'],['img','3.jpg'],['img','4.jpg'],['img','5.jpg'],['img','6.jpg'],
['market'],['img','16.jpg','note'],['img','9.jpg'],['img','10.jpg'],['img','11.jpg'],['img','12.jpg'],
['lunch'],['img','14.jpg'],['img','7.jpg'],['img','8.jpg'],['img','15.jpg'],
['img','62c967bd-f9ee-431b-8196-d00fcce24538.png'],['img','18.jpg'],
['img','Apresentação A - Gui Nonato (20).jpg'],['img','Apresentação A - Gui Nonato (21).jpg'],['img','Apresentação A - Gui Nonato (22).jpg']
];
const stage=document.getElementById('stage'),counter=document.getElementById('counter');
function market(){return '<div class="market"><h1>Comparativo de marketplaces</h1>'+
[['Mercado Livre',100,'Referência'],['Shopee',72,'Alto volume'],['Amazon',58,'Crescimento'],['Magalu',42,'Varejo + marketplace'],['TikTok Shop',30,'Forte crescimento']]
.map(x=>'<div class="market-row"><div>'+x[0]+'</div><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div>'+x[2]+'</div></div>').join('')+'</div>'}
function render(s,i){
 let el=document.createElement('section');el.className='slide'+(i===0?' on':'');
 if(s[0]==='img'){
   let img=document.createElement('img');img.src=A+encodeURIComponent(s[1]);img.alt='Slide '+(i+1);
   img.onerror=()=>{let e=document.createElement('div');e.className='err';e.style.display='flex';e.textContent='Não foi possível carregar este slide. Avance e volte para tentar novamente.';el.appendChild(e)};
   el.appendChild(img);
   if(s[2]==='note'){let n=document.createElement('div');n.className='note';n.textContent='ex: kit de buxinho com 10';el.appendChild(n)}
 } else if(s[0]==='market'){el.innerHTML=market()}
 else {el.innerHTML='<div class="lunch"><h1>PAUSA PARA O <span>ALMOÇO</span></h1><div class="timer" id="timer">01:30:00</div></div>'}
 return el
}
slides.forEach((s,i)=>stage.appendChild(render(s,i)));
let idx=0,els=[...document.querySelectorAll('.slide')],end=null,tick=null;
function show(n){n=Math.max(0,Math.min(els.length-1,n));els[idx].classList.remove('on');idx=n;els[idx].classList.add('on');counter.textContent=(idx+1)+' / '+els.length;if(slides[idx][0]==='lunch')startLunch()}
function startLunch(){if(!end)end=Date.now()+5400000;clearInterval(tick);const u=()=>{let l=Math.max(0,Math.ceil((end-Date.now())/1000)),t=document.getElementById('timer');if(t)t.textContent=[Math.floor(l/3600),Math.floor((l%3600)/60),l%60].map(v=>String(v).padStart(2,'0')).join(':')};u();tick=setInterval(u,1000)}
document.getElementById('next').onclick=()=>show(idx+1);
document.getElementById('prev').onclick=()=>show(idx-1);
document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});
counter.textContent='1 / '+els.length;
</script>
</body></html>
