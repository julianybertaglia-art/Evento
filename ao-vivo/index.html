<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0"><title>Imersão Ecommerce — AO VIVO</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}#stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center}.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}.slide.on{display:flex}.slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;display:flex;gap:10px;opacity:.08;transition:.2s}body:hover .controls{opacity:1}button,a.btn{border:1px solid #444;background:#111;color:#fff;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;text-decoration:none}button.primary{background:#ffd83d;color:#000;border-color:#ffd83d}.counter{position:fixed;right:18px;bottom:18px;z-index:15;color:#ffffff88;font-size:13px}.market{width:min(1500px,90vw);padding:54px;border:1px solid #5a4a16;background:#090909}.market h1{font-size:48px;margin:0 0 32px;color:#ffd83d}.market-row{display:grid;grid-template-columns:280px 1fr 180px;gap:22px;align-items:center;padding:18px 0;border-bottom:1px solid #222;font-size:26px;font-weight:800}.track{height:22px;background:#222;border-radius:99px;overflow:hidden}.fill{height:100%;background:#ffd83d}.lunch{text-align:center}.lunch h1{font-size:88px;margin:0 0 40px}.lunch h1 span{color:#ffd83d}.timer{font-size:150px;font-weight:900;color:#ffd83d;border:2px solid #ffd83d;border-radius:28px;padding:28px 60px;min-width:850px}.note{position:absolute;right:50px;top:50px;background:#111;border:2px solid #ffd83d;color:#ffd83d;border-radius:999px;padding:12px 20px;font-size:24px;font-weight:900}.titleSlide,.formQr,.drawWrap{width:min(1600px,94vw,calc(94vh * 16 / 9));aspect-ratio:16/9;max-height:94vh;overflow:hidden;position:relative;border:1px solid rgba(255,216,61,.35);background:radial-gradient(circle at 78% 20%,rgba(255,216,61,.18),transparent 28%),linear-gradient(135deg,#050505,#0b0b08 60%,#020202)}
.titleSlide{display:flex;flex-direction:column;justify-content:center;padding:clamp(14px,3.7vw,70px) clamp(18px,4.7vw,90px)}
.eyebrow{font-size:clamp(9px,1.15vw,22px);letter-spacing:.24em;text-transform:uppercase;color:#ffd83d;font-weight:900;margin-bottom:clamp(8px,1.45vw,28px)}
.bigTitle{font-size:clamp(30px,5.6vw,108px);line-height:.95;font-weight:900;text-transform:uppercase;letter-spacing:-.045em;margin:0 0 clamp(8px,1.45vw,28px);white-space:nowrap}
.subtitle{font-size:clamp(12px,1.65vw,32px);line-height:1.22;color:#d8d8d8;font-weight:700;max-width:70%}
.formQr{display:grid;grid-template-columns:1.18fr .82fr;align-items:center;gap:clamp(12px,3vw,58px);padding:clamp(14px,3.5vw,66px) clamp(18px,4.5vw,86px)}
.formQr .k{color:#ffd83d;font-size:clamp(8px,1.05vw,20px);font-weight:900;letter-spacing:.18em}
.formQr h1{font-size:clamp(24px,4vw,76px);line-height:.95;margin:clamp(6px,.9vw,18px) 0;max-width:100%}
.formQr h1 span{color:#ffd83d}
.formQr p{font-size:clamp(10px,1.45vw,28px);line-height:1.28;color:#bbb;margin:0}
.formQr .url{font-size:clamp(8px,1.1vw,21px);color:#ffd83d;font-weight:900;margin-top:clamp(6px,1.1vw,22px);white-space:nowrap}
.formQr .qrbox{background:#fff;border-radius:clamp(8px,1.5vw,28px);padding:clamp(8px,1.7vw,32px);display:flex;align-items:center;justify-content:center;max-height:78%}
.formQr .qrbox img{width:min(100%,330px);height:auto;display:block}
.drawWrap{border:0;background:#050505}
.drawFrame{position:absolute;inset:0;border:0;width:100%;height:100%;background:#050505}</style></head><body><div id="stage"></div><div class="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button><a class="btn" href="organizar/" target="_blank">Organizar</a></div><div class="counter" id="counter"></div><script>const A='../apresentacao/assets/',KEY='imersao_ao_vivo_order';const baseSlides=[{id:'s1',type:'img',src:'1.jpg',label:'01 Abertura'},{id:'s2',type:'img',src:'2.jpg',label:'02 Slide 2'},{id:'s3',type:'img',src:'3.jpg',label:'03 Slide 3'},{id:'s4',type:'img',src:'4.jpg',label:'04 Slide 4'},{id:'s5',type:'img',src:'5.jpg',label:'05 Slide 5'},{id:'formas',type:'img',src:'6.jpg',label:'Formas de vender online'},{id:'market',type:'market',label:'Comparativo marketplaces'},{id:'ml',type:'img',src:'16.jpg',label:'Mercado Livre — Estratégias',note:true},{id:'analise1',type:'img',src:'9.jpg',label:'Análise de Mercado 1'},{id:'analise2',type:'img',src:'10.jpg',label:'Análise de Mercado 2'},{id:'produto',type:'img',src:'11.jpg',label:'Desenvolvimento de Produto'},{id:'tvx',type:'img',src:'12.jpg',label:'TVX'},{id:'lunch',type:'lunch',label:'Almoço'},{id:'patrocinador',type:'img',src:'14.jpg',label:'Patrocinador'},{id:'import1',type:'img',src:'7.jpg',label:'Importação 1'},{id:'import2',type:'img',src:'8.jpg',label:'Importação 2'},{id:'argo',type:'img',src:'15.jpg',label:'Argo'},{id:'analiseConta',type:'title',label:'Análise de conta',title:'ANÁLISE DE CONTA',subtitle:'Diagnóstico ao vivo para mostrar onde estão os gargalos e as oportunidades.'},{id:'formulario',type:'img',src:'62c967bd-f9ee-431b-8196-d00fcce24538.png',label:'Formulário'},{id:'formDigital',type:'formqr',label:'QR inscrição sorteio'},{id:'sorteioTelao',type:'draw',label:'Sorteio no telão'},{id:'s18',type:'img',src:'18.jpg',label:'Slide 18'},{id:'mentoria',type:'img',src:'Apresentação A - Gui Nonato (20).jpg',label:'Mentoria'},{id:'qr',type:'img',src:'Apresentação A - Gui Nonato (21).jpg',label:'QR Code'},{id:'final',type:'img',src:'Apresentação A - Gui Nonato (22).jpg',label:'Final'}];function normalizeOrder(ids){let base=baseSlides.map(s=>s.id);if(!Array.isArray(ids))return base.slice();let clean=ids.filter((id,i)=>base.includes(id)&&ids.indexOf(id)===i);if(!clean.includes('analiseConta')){let p=clean.indexOf('argo');clean.splice(p>=0?p+1:base.indexOf('analiseConta'),0,'analiseConta')}if(!clean.includes('formDigital')){let p=clean.indexOf('formulario');clean.splice(p>=0?p+1:base.indexOf('formDigital'),0,'formDigital')}if(!clean.includes('sorteioTelao')){let p=clean.indexOf('formDigital');clean.splice(p>=0?p+1:base.indexOf('sorteioTelao'),0,'sorteioTelao')}base.forEach(id=>{if(!clean.includes(id))clean.push(id)});return clean}function getOrder(){let q=new URLSearchParams(location.search).get('ord'),ids=null;if(q){ids=q.split(',').filter(Boolean);localStorage.setItem(KEY,JSON.stringify(ids))}else{try{ids=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}}ids=normalizeOrder(ids);localStorage.setItem(KEY,JSON.stringify(ids));let map=new Map(baseSlides.map(s=>[s.id,s]));return ids.map(id=>map.get(id)).filter(Boolean)}const slides=getOrder(),stage=document.getElementById('stage'),counter=document.getElementById('counter');function market(){return '<div class="market"><h1>Comparativo de marketplaces</h1>'+[['Mercado Livre',100,'Referência'],['Shopee',72,'Alto volume'],['Amazon',58,'Crescimento'],['Magalu',42,'Varejo + marketplace'],['TikTok Shop',30,'Forte crescimento']].map(x=>'<div class="market-row"><div>'+x[0]+'</div><div class="track"><div class="fill" style="width:'+x[1]+'%"></div></div><div>'+x[2]+'</div></div>').join('')+'</div>'}function titleSlide(s){return '<div class="titleSlide"><div class="eyebrow">AO VIVO</div><h1 class="bigTitle">'+s.title+'</h1><div class="subtitle">'+s.subtitle+'</div></div>'}function render(s,i){let el=document.createElement('section');el.className='slide'+(i===0?' on':'');if(s.type==='img'){let img=document.createElement('img');img.src=A+encodeURIComponent(s.src);img.alt=s.label;el.appendChild(img);if(s.note){let n=document.createElement('div');n.className='note';n.textContent='ex: kit de buxinho com 10';el.appendChild(n)}}else if(s.type==='market'){el.innerHTML=market()}else if(s.type==='title'){el.innerHTML=titleSlide(s)}else if(s.type==='formqr'){el.innerHTML='<div class="formQr"><div><div class="k">IMERSÃO ECOMMERCE</div><h1>Preencha e participe do <span>sorteio</span></h1><p>Aponte a câmera para o QR Code e envie o formulário. Seu nome entra automaticamente no sorteio.</p><div class="url">imersao.guinonato.com/formulario/</div></div><div class="qrbox"><img src="../formulario/qr.svg?v=qr-fix-2" alt="QR Code"></div></div>'}else if(s.type==='draw'){el.innerHTML='<div class="drawWrap"><iframe class="drawFrame" src="../sorteio/telao/?v=3"></iframe></div>'}else{el.innerHTML='<div class="lunch"><h1>PAUSA PARA O <span>ALMOÇO</span></h1><div class="timer" id="timer">01:30:00</div></div>'}return el}slides.forEach((s,i)=>stage.appendChild(render(s,i)));let idx=0,els=[...document.querySelectorAll('.slide')],end=null,tick=null;function show(n){n=Math.max(0,Math.min(els.length-1,n));els[idx].classList.remove('on');idx=n;els[idx].classList.add('on');counter.textContent=(idx+1)+' / '+els.length+' — '+slides[idx].label;if(slides[idx].type==='lunch')startLunch()}function startLunch(){if(!end)end=Date.now()+5400000;clearInterval(tick);const u=()=>{let l=Math.max(0,Math.ceil((end-Date.now())/1000)),t=document.getElementById('timer');if(t)t.textContent=[Math.floor(l/3600),Math.floor((l%3600)/60),l%60].map(v=>String(v).padStart(2,'0')).join(':')};u();tick=setInterval(u,1000)}next.onclick=()=>show(idx+1);prev.onclick=()=>show(idx-1);full.onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});show(0);</script></body></html>
