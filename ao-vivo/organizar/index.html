<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<title>Organizar AO VIVO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif;padding:18px}.top{position:sticky;top:0;background:#080808ee;backdrop-filter:blur(10px);z-index:10;padding-bottom:14px;border-bottom:1px solid #222}h1{margin:0 0 8px;font-size:26px}p{margin:0;color:#bbb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,a{border:1px solid #444;background:#151515;color:#fff;border-radius:999px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.primary{background:#ffd83d!important;color:#000!important;border-color:#ffd83d!important}.danger{background:#331414}.list{display:grid;gap:10px;margin-top:16px}.card{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:#141414;border:1px solid #2a2a2a;border-radius:14px;padding:10px;cursor:grab}.card.dragging{opacity:.4}.thumb{width:72px;height:42px;background:#000;border-radius:8px;object-fit:contain;border:1px solid #333}.n{font-size:12px;color:#ffd83d;font-weight:900}.title{font-size:17px;font-weight:900}.mini{display:flex;gap:6px}.mini button{padding:8px 10px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#ffd83d;color:#000;font-weight:900;border-radius:999px;padding:12px 18px;display:none;z-index:50}.marketThumb,.lunchThumb{display:flex;align-items:center;justify-content:center;width:72px;height:42px;border-radius:8px;background:#111;border:1px solid #333;color:#ffd83d;font-weight:900;font-size:11px;text-align:center}
</style>
</head>
<body>
<div class="top"><h1>Organizar ordem — AO VIVO</h1><p>Arraste os slides ou use ↑ ↓. Depois clique em <b>Salvar e abrir</b>.</p><div class="actions"><button class="primary" id="saveOpen">Salvar e abrir apresentação</button><button id="save">Só salvar</button><button class="danger" id="reset">Voltar ordem padrão</button><a href="../" target="_blank">Abrir apresentação</a></div></div>
<div class="list" id="list"></div><div class="toast" id="toast">Salvo!</div>
<script>
const A='../../apresentacao/assets/',KEY='imersao_ao_vivo_order';
const slides=[
{id:'s1',type:'img',src:'1.jpg',label:'01 Abertura'}, {id:'s2',type:'img',src:'2.jpg',label:'02 Slide 2'}, {id:'s3',type:'img',src:'3.jpg',label:'03 Slide 3'}, {id:'s4',type:'img',src:'4.jpg',label:'04 Slide 4'}, {id:'s5',type:'img',src:'5.jpg',label:'05 Slide 5'}, {id:'formas',type:'img',src:'6.jpg',label:'Formas de vender online'},
{id:'market',type:'market',label:'Comparativo marketplaces'}, {id:'ml',type:'img',src:'16.jpg',label:'Mercado Livre — Estratégias'}, {id:'analise1',type:'img',src:'9.jpg',label:'Análise de Mercado 1'}, {id:'analise2',type:'img',src:'10.jpg',label:'Análise de Mercado 2'}, {id:'produto',type:'img',src:'11.jpg',label:'Desenvolvimento de Produto'}, {id:'tvx',type:'img',src:'12.jpg',label:'TVX'},
{id:'lunch',type:'lunch',label:'Almoço'}, {id:'patrocinador',type:'img',src:'14.jpg',label:'Patrocinador'}, {id:'import1',type:'img',src:'7.jpg',label:'Importação 1'}, {id:'import2',type:'img',src:'8.jpg',label:'Importação 2'}, {id:'argo',type:'img',src:'15.jpg',label:'Argo'},
{id:'formulario',type:'img',src:'62c967bd-f9ee-431b-8196-d00fcce24538.png',label:'Formulário'}, {id:'s18',type:'img',src:'18.jpg',label:'Slide 18'}, {id:'mentoria',type:'img',src:'Apresentação A - Gui Nonato (20).jpg',label:'Mentoria'}, {id:'qr',type:'img',src:'Apresentação A - Gui Nonato (21).jpg',label:'QR Code'}, {id:'final',type:'img',src:'Apresentação A - Gui Nonato (22).jpg',label:'Final'}];
let order;try{order=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} if(!Array.isArray(order))order=slides.map(s=>s.id);function ordered(){let map=new Map(slides.map(s=>[s.id,s])),used=new Set(),out=[];order.forEach(id=>{if(map.has(id)&&!used.has(id)){out.push(map.get(id));used.add(id)}});slides.forEach(s=>{if(!used.has(s.id))out.push(s)});order=out.map(s=>s.id);return out}
function card(s,i){let thumb=s.type==='img'?`<img class="thumb" src="${A+encodeURIComponent(s.src)}">`:s.type==='market'?'<div class="marketThumb">MARKET</div>':'<div class="lunchThumb">ALMOÇO</div>';return `<div class="card" draggable="true" data-id="${s.id}">${thumb}<div><div class="n">${String(i+1).padStart(2,'0')}</div><div class="title">${s.label}</div></div><div class="mini"><button data-up>↑</button><button data-down>↓</button></div></div>`}
function render(){list.innerHTML=ordered().map(card).join('');bind()}
function move(id,dir){let i=order.indexOf(id),j=i+dir;if(i<0||j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];render()}
function bind(){document.querySelectorAll('[data-up]').forEach(b=>b.onclick=e=>{e.stopPropagation();move(b.closest('.card').dataset.id,-1)});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=e=>{e.stopPropagation();move(b.closest('.card').dataset.id,1)});let drag=null;document.querySelectorAll('.card').forEach(c=>{c.ondragstart=()=>{drag=c;c.classList.add('dragging')};c.ondragend=()=>{c.classList.remove('dragging');drag=null};c.ondragover=e=>{e.preventDefault();let after=[...list.querySelectorAll('.card:not(.dragging)')].find(el=>e.clientY<=el.getBoundingClientRect().top+el.offsetHeight/2);if(after)list.insertBefore(drag,after);else list.appendChild(drag)};c.ondrop=e=>{e.preventDefault();order=[...list.querySelectorAll('.card')].map(x=>x.dataset.id);render()}})}
function save(){localStorage.setItem(KEY,JSON.stringify(order));toast.style.display='block';setTimeout(()=>toast.style.display='none',1200)}
save.onclick=save;saveOpen.onclick=()=>{save();location.href='../?ord='+order.join(',')+'&v='+Date.now()};reset.onclick=()=>{order=slides.map(s=>s.id);save();render()};render();
</script>
</body></html>
