<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imersão Ecommerce — Apresentação Final</title>
<style>
:root{--gold:#ffd83d;--gold2:#f4b31c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{cursor:none}.ui{cursor:default}#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#000;overflow:hidden;box-shadow:0 0 90px #000}#slides{position:absolute;inset:0}.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease,transform .7s ease;transform:scale(1.018);background:#000;overflow:hidden}.slide.active{opacity:1;pointer-events:auto;transform:scale(1)}.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050505}.back{position:absolute;inset:-50px;background-position:center;background-size:cover;filter:blur(34px) brightness(.42) saturate(1.18);transform:scale(1.08);opacity:.9}.photo img{position:relative;z-index:2;max-width:100%;max-height:100%;width:auto;height:auto;display:block;object-fit:contain;box-shadow:0 0 46px rgba(0,0,0,.55)}.slide:after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 58%,rgba(0,0,0,.28)),linear-gradient(90deg,rgba(0,0,0,.14),transparent 22%,transparent 78%,rgba(0,0,0,.14))}.frame{position:absolute;inset:24px;z-index:9;border:1px solid rgba(255,216,61,.18);pointer-events:none;box-shadow:inset 0 0 50px rgba(255,216,61,.045)}#dust{position:absolute;inset:0;width:1920px;height:1080px;z-index:8;pointer-events:none}.beam{position:absolute;top:-10px;width:8px;height:1130px;border-radius:999px;z-index:7;opacity:0;background:linear-gradient(180deg,rgba(255,235,150,0),rgba(255,221,95,1),rgba(255,214,58,0));box-shadow:0 0 22px rgba(255,216,61,.85),0 0 90px rgba(255,178,0,.35);mix-blend-mode:screen}.beam.left{left:585px;transform:rotate(15deg)}.beam.right{left:1440px;transform:rotate(17deg)}.slide.active .beam{animation:beamIn 1s ease forwards,pulse 2.4s ease-in-out 1s infinite}@keyframes beamIn{from{opacity:0;transform:scaleY(.05) rotate(15deg)}to{opacity:.8}}@keyframes pulse{50%{opacity:.55}}.mist{position:absolute;left:0;right:0;bottom:-70px;height:250px;z-index:6;background:radial-gradient(ellipse at 50% 70%,rgba(255,189,49,.28),rgba(255,189,49,.12) 34%,transparent 72%);filter:blur(16px);mix-blend-mode:screen}.wipe{position:absolute;inset:-25% -10%;z-index:30;background:linear-gradient(100deg,transparent,rgba(244,179,28,.72),rgba(255,241,168,.96),rgba(244,179,28,.72),transparent);transform:skewX(-12deg) translateX(-135%);pointer-events:none}.wipe.go{animation:wipe .78s cubic-bezier(.7,0,.2,1)}@keyframes wipe{0%{transform:skewX(-12deg) translateX(-135%)}48%,55%{transform:skewX(-12deg) translateX(0)}100%{transform:skewX(-12deg) translateX(135%)}}.slideName{position:absolute;left:58px;bottom:42px;z-index:20;font-size:14px;font-weight:800;letter-spacing:.18em;color:rgba(255,216,61,.75);text-transform:uppercase}.slideNo{position:absolute;right:56px;bottom:42px;z-index:20;font-size:18px;font-weight:700;letter-spacing:.18em;color:#ffffff66}.progress{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:40;box-shadow:0 0 24px rgba(255,216,61,.7);transition:width .35s ease}.dots{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:20;display:flex;gap:8px}.dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,216,61,.25)}.dot.on{width:28px;background:var(--gold);box-shadow:0 0 16px rgba(255,216,61,.55)}#controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;opacity:0;transition:.2s}.ui #controls{opacity:1}button{border:1px solid #ffffff26;background:#111b;color:#fff;border-radius:999px;padding:10px 16px;font:700 12px Arial;backdrop-filter:blur(10px)}button.primary{background:#ffd83d!important;color:#000!important}.hint{position:fixed;right:18px;bottom:22px;z-index:100;color:#ffffff80;font-size:11px;opacity:0}.ui .hint{opacity:1}.lunchSlide{position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,rgba(255,216,61,.12),transparent 30%),radial-gradient(circle at 12% 78%,rgba(244,179,28,.11),transparent 24%),linear-gradient(180deg,#030303 0%,#080705 50%,#020202 100%);display:flex;align-items:center;justify-content:center;text-align:center}.lunchSlide:before{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 0 13%,rgba(255,216,61,.28) 13.4%,transparent 14.3% 85%,rgba(255,216,61,.28) 86%,transparent 87%)}.lunchWrap{position:relative;z-index:2}.lunchTitle{font-size:86px;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.lunchTitle span{color:var(--gold)}.timerBox{margin:48px auto 0;min-width:900px;padding:34px 66px 39px;border-radius:34px;border:2px solid rgba(255,216,61,.38);background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(18,14,8,.92));box-shadow:0 0 40px rgba(255,216,61,.18),inset 0 0 45px rgba(255,216,61,.06)}#lunchTimer{font-size:150px;line-height:1;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}#lunchSub{margin-top:38px;font-size:42px;letter-spacing:.04em}.lunchReturn{margin-top:18px;font-size:24px;color:rgba(255,216,61,.86);font-weight:800;letter-spacing:.10em;text-transform:uppercase}.slide[data-kind='lunch'] .slideName,.slide[data-kind='lunch'] .slideNo{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><canvas id="dust" width="1920" height="1080"></canvas><div id="slides"></div><div class="wipe" id="wipe"></div><div class="progress" id="progress"></div><div class="dots" id="dots"></div></div></div>
<div id="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button></div><div class="hint">← → / espaço • F tela cheia • L reinicia almoço</div>
<script>
const VERSION='final-correta-1307';
const BASE='https://julianybertaglia-art.github.io/Evento/apresentacao/assets/';
const slidesData=[
{src:'1.jpg',label:'abertura',kind:'opening'},
{src:'2.jpg',label:'imersão'},
{src:'3.jpg',label:'imersão'},
{src:'4.jpg',label:'imersão'},
{src:'5.jpg',label:'imersão'},
{src:'6.jpg',label:'formas de vender online'},
{src:'16.jpg',label:'mercado livre'},
{src:'9.jpg',label:'análise de mercado'},
{src:'10.jpg',label:'análise de mercado'},
{src:'11.jpg',label:'desenvolvimento de produto'},
{src:'12.jpg',label:'tvx'},
{kind:'lunch',label:'almoço'},
{src:'14.jpg',label:'patrocinador'},
{src:'7.jpg',label:'importação'},
{src:'8.jpg',label:'importação'},
{src:'15.jpg',label:'argo'},
{src:'62c967bd-f9ee-431b-8196-d00fcce24538.png',label:'formulário'},
{src:'18.jpg',label:'imersão'},
{src:'Apresentação A - Gui Nonato (16).jpg',label:'mentoria'},
{src:'Apresentação A - Gui Nonato (17).jpg',label:'inscrição'}
];
const LUNCH_DURATION=60*60;let lunchEndAt=null,lunchTimerInterval=null;
function imgURL(name){return BASE+encodeURIComponent(name).replace(/%2F/g,'/')+'?v='+VERSION}
function lunchHTML(){return `<div class="lunchSlide"><div class="lunchWrap"><div class="lunchTitle">PAUSA PARA O <span>ALMOÇO</span></div><div class="timerBox"><div id="lunchTimer">01:00:00</div></div><div id="lunchSub">Retornamos em 1 hora</div><div class="lunchReturn" id="lunchReturn"></div></div></div>`}
function content(s,i){if(s.kind==='lunch')return lunchHTML();let u=imgURL(s.src);return `<div class="photo"><div class="back" style="background-image:url('${u}')"></div><img src="${u}" alt="Slide ${i+1}" loading="${i<4?'eager':'lazy'}" onerror="this.outerHTML='<div style=&quot;z-index:50;color:#ffd83d;font-size:42px;font-weight:900&quot;>Erro ao carregar '+this.src+'</div>'"></div>`}
const wrap=document.getElementById('slides'),dots=document.getElementById('dots');
wrap.innerHTML=slidesData.map((s,i)=>`<section class="slide ${i===0?'active':''}" data-kind="${s.kind||'image'}">${content(s,i)}<div class="frame"></div>${i===0?'<div class="mist"></div><div class="beam left"></div><div class="beam right"></div>':''}<div class="slideName">${s.label}</div><div class="slideNo">${String(i+1).padStart(2,'0')}</div></section>`).join('');
dots.innerHTML=slidesData.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('');
const slides=[...document.querySelectorAll('.slide')],dotEls=[...document.querySelectorAll('.dot')],stage=document.getElementById('stage'),progress=document.getElementById('progress'),wipe=document.getElementById('wipe');let idx=0,busy=false,uiTimer;
function fit(){stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1920,innerHeight/1080)})`}addEventListener('resize',fit);fit();
function showUI(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.remove('ui'),1800)}addEventListener('mousemove',showUI);showUI();
function formatTime(t){let h=String(Math.floor(t/3600)).padStart(2,'0'),m=String(Math.floor((t%3600)/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');return `${h}:${m}:${s}`}
function updateLunchTimer(){if(!lunchEndAt)return;let left=Math.max(0,Math.ceil((lunchEndAt-Date.now())/1000));let timer=document.getElementById('lunchTimer'),sub=document.getElementById('lunchSub'),ret=document.getElementById('lunchReturn');if(timer)timer.textContent=formatTime(left);if(sub)sub.textContent=left>0?'Retornamos em '+(Math.ceil(left/60))+' minutos':'Estamos voltando';if(ret){let d=new Date(lunchEndAt);ret.textContent=left>0?'RETORNO PREVISTO: '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'RETORNO AGORA'}if(left<=0&&lunchTimerInterval){clearInterval(lunchTimerInterval);lunchTimerInterval=null}}
function startLunchTimer(reset=false){if(reset||!lunchEndAt)lunchEndAt=Date.now()+LUNCH_DURATION*1000;updateLunchTimer();clearInterval(lunchTimerInterval);lunchTimerInterval=setInterval(updateLunchTimer,1000)}
function restart(slide){slide.querySelectorAll('.beam,.mist,.photo img').forEach(el=>{el.style.animation='none';void el.offsetHeight;el.style.animation=''})}
function after(){progress.style.width=((idx+1)/slides.length*100)+'%';restart(slides[idx]);if(slidesData[idx].kind==='lunch')startLunchTimer(false)}
function go(n,force=false){n=Math.max(0,Math.min(slides.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{slides[idx].classList.remove('active');dotEls[idx].classList.remove('on');idx=n;slides[idx].classList.add('active');dotEls[idx].classList.add('on');after()},260);setTimeout(()=>busy=false,760)}
progress.style.width=(1/slides.length*100)+'%';document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='l')startLunchTimer(true)});
const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d'),pts=Array.from({length:240},()=>({x:Math.random()*1920,y:Math.random()*1080,r:.6+Math.random()*2.5,v:.22+Math.random()*.62,dx:(Math.random()-.5)*.26,a:.05+Math.random()*.25}));
(function dust(){ctx.clearRect(0,0,1920,1080);if(idx===0){for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-16;p.x=Math.random()*1920}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*1.55})`;ctx.fill()}}requestAnimationFrame(dust)})();
</script>
</body>
</html>
