<script>
const V='final-almoco-90min-20260923',BASE='../apresentacao/assets/',KEY='imersao_final_slide_order_v2';
const S=[['abertura','1.jpg','Abertura','opening'],['s2','2.jpg','Imersão'],['s3','3.jpg','Imersão'],['s4','4.jpg','Imersão'],['s5','5.jpg','Imersão'],['formas','6.jpg','Formas de vender online'],['ml','16.jpg','Mercado Livre — Estratégias'],['analise1','9.jpg','Análise de Mercado'],['analise2','10.jpg','Análise de Mercado'],['produto','11.jpg','Desenvolvimento de Produto'],['tvx','12.jpg','TVX'],['almoco',null,'Almoço','lunch'],['patrocinador','14.jpg','Patrocinador'],['import1','7.jpg','Importação'],['import2','8.jpg','Importação'],['argo','15.jpg','Argo'],['formulario','62c967bd-f9ee-431b-8196-d00fcce24538.png','Formulário'],['imersao18','18.jpg','Imersão'],['mentoria','Apresentação A - Gui Nonato (16).jpg','Mentoria'],['qr','Apresentação A - Gui Nonato (19).jpg','QR Code']].map(a=>({id:a[0],src:a[1],label:a[2],kind:a[3]||'image'}));

const logo=d=>`https://www.google.com/s2/favicons?domain=${d}&sz=128`;const market=`<div class="market"><div class="mi"><div class="mk">Principais marketplaces do Brasil</div><div class="mt">Comparativo de faturamento geral</div><div class="bars">${[['mercadolivre.com.br','Mercado Livre','100%','Referência'],['shopee.com.br','Shopee','72%','Alto volume'],['amazon.com.br','Amazon','58%','Crescimento'],['magalu.com','Magalu','42%','Varejo + marketplace'],['tiktok.com','TikTok Shop','30%','Forte crescimento']].map(x=>`<div class="bar"><div class="bn"><span class="ico"><img src="${logo(x[0])}"></span><span>${x[1]}</span></div><div class="tr"><div class="fi" style="width:${x[2]}"></div></div><div class="val">${x[3]}</div></div>`).join('')}</div></div></div>`;
let end=null,int=null;function ft(t){return `${String(Math.floor(t/3600)).padStart(2,'0')}:${String(Math.floor((t%3600)/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`}function upd(){if(!end)return;let l=Math.max(0,Math.ceil((end-Date.now())/1000));let a=document.getElementById('timer'),b=document.getElementById('sub'),r=document.getElementById('ret');if(a)a.textContent=ft(l);if(b)b.textContent=l>0?'Retornamos em '+(l>3599?'1 hora':Math.ceil(l/60)+' minutos'):'Estamos voltando';if(r){let d=new Date(end);r.textContent=l>0?'RETORNO PREVISTO: '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'RETORNO AGORA'}if(l<=0&&int){clearInterval(int);int=null}}function lunch(reset=false){if(reset||!end)end=Date.now()+5400000;upd();if(int)clearInterval(int);int=setInterval(upd,1000)}

slides.innerHTML=O.map(html).join('');document.querySelectorAll('.photo').forEach(e=>e.querySelector('.back').style.backgroundImage=`url('${e.dataset.bg}')`);document.querySelector('.dots').innerHTML=O.map((_,i)=>`<span class="dot ${i?'':'on'}"></span>`).join('');let idx=0,SL=[...document.querySelectorAll('.sl')],D=[...document.querySelectorAll('.dot')],busy=false;function fit(){let z=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(-50%,-50%) scale(${z})`}onresize=fit;fit();let ui;function show(){document.body.classList.add('ui');clearTimeout(ui);ui=setTimeout(()=>document.body.classList.remove('ui'),1600)}onmousemove=show;show();function after(){progress.style.width=((idx+1)/SL.length*100)+'%';if(O[idx].kind==='lunch')lunch()}function go(n,force=false){n=Math.max(0,Math.min(SL.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{SL[idx].classList.remove('on');D[idx].classList.remove('on');idx=n;SL[idx].classList.add('on');D[idx].classList.add('on');after()},315);setTimeout(()=>busy=false,900)}next.onclick=()=>go(idx+1);prev.onclick=()=>go(idx-1);full.onclick=()=>document.documentElement.requestFullscreen?.();onkeydown=e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(SL.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='l')lunch(true);if(e.key.toLowerCase()==='r')go(idx,true)};after();
const c=dust,ctx=c.getContext('2d'),pts=Array.from({length:240},()=>({x:Math.random()*1920,y:Math.random()*1080,r:.6+Math.random()*2.5,v:.22+Math.random()*.62,dx:(Math.random()-.5)*.26,a:.05+Math.random()*.25}));(function loop(){ctx.clearRect(0,0,1920,1080);if(idx===0){for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-16;p.x=Math.random()*1920}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*1.55})`;ctx.fill()}}requestAnimationFrame(loop)})();
