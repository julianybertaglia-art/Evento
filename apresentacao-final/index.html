<style>
:root{--gold:#ffd83d;--gold2:#f4b31c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{cursor:none}.ui{cursor:default}#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#000;overflow:hidden;box-shadow:0 0 90px #000;isolation:isolate}#slides{position:absolute;inset:0;z-index:1}.slide{position:absolute;inset:0;opacity:0;pointer-events:none;background:#000;transition:opacity .46s ease,transform .7s cubic-bezier(.16,1,.3,1),filter .55s ease;transform:scale(1.018);filter:blur(3px);overflow:hidden}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:none}.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050505}.back{position:absolute;inset:-46px;background-position:center;background-size:cover;filter:blur(32px) brightness(.45) saturate(1.16);transform:scale(1.08);opacity:.92}.photo img{display:block;position:relative;z-index:2;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;box-shadow:0 0 42px rgba(0,0,0,.58)}.slide:before{content:"";position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 56%,rgba(0,0,0,.25) 100%),linear-gradient(90deg,rgba(0,0,0,.12),transparent 22%,transparent 78%,rgba(0,0,0,.12))}.slide:after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;background:linear-gradient(105deg,transparent 0 39%,rgba(255,232,132,.055) 48%,rgba(255,232,132,.025) 51%,transparent 60%);transform:translateX(-130%);animation:sweep 9s ease-in-out infinite}@keyframes sweep{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}.frame{position:absolute;inset:24px;z-index:10;border:1px solid rgba(255,216,61,.17);pointer-events:none;box-shadow:inset 0 0 50px rgba(255,216,61,.045)}.frame:before,.frame:after{content:"";position:absolute;width:220px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);filter:drop-shadow(0 0 12px rgba(255,216,61,.58))}.frame:before{left:-1px;top:-1px}.frame:after{right:-1px;bottom:-1px;transform:rotate(180deg)}#dust{position:absolute;inset:0;width:1920px;height:1080px;z-index:8;pointer-events:none;mix-blend-mode:screen}.grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.035;mix-blend-mode:soft-light;background-image:url('data:image/svg+xml,%3Csvg viewBox=%220 0 180 180%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.95%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22 opacity=%22.4%22/%3E%3C/svg%3E')}.beam{position:absolute;top:-10px;width:8px;height:1130px;border-radius:999px;z-index:8;opacity:0;background:linear-gradient(180deg,rgba(255,235,150,0),rgba(255,221,95,1),rgba(255,214,58,0));box-shadow:0 0 22px rgba(255,216,61,.85),0 0 90px rgba(255,178,0,.35);mix-blend-mode:screen;transform-origin:50% 0}.beam.left{left:585px;transform:rotate(15deg) scaleY(.03)}.beam.right{left:1440px;transform:rotate(17deg) scaleY(.03)}.slide.active .beam.left{animation:beamLeft 1s cubic-bezier(.16,1,.3,1) forwards,pulse 2.4s ease-in-out 1.05s infinite}.slide.active .beam.right{animation:beamRight 1s cubic-bezier(.16,1,.3,1) .12s forwards,pulse 2.4s ease-in-out 1.15s infinite}@keyframes beamLeft{to{opacity:.82;transform:rotate(15deg) scaleY(1)}}@keyframes beamRight{to{opacity:.82;transform:rotate(17deg) scaleY(1)}}@keyframes pulse{50%{opacity:.55}}.mist{position:absolute;left:0;right:0;bottom:-70px;height:250px;z-index:7;background:radial-gradient(ellipse at 50% 70%,rgba(255,189,49,.28),rgba(255,189,49,.12) 34%,transparent 72%);filter:blur(16px);mix-blend-mode:screen}.wipe{position:absolute;inset:-25% -10%;z-index:50;background:linear-gradient(100deg,transparent 0,rgba(244,179,28,.72) 34%,rgba(255,241,168,.96) 50%,rgba(244,179,28,.72) 66%,transparent 100%);transform:skewX(-12deg) translateX(-135%);pointer-events:none;filter:drop-shadow(0 0 42px rgba(255,216,61,.45))}.wipe.go{animation:wipe .82s cubic-bezier(.7,0,.2,1)}@keyframes wipe{0%{transform:skewX(-12deg) translateX(-135%)}48%,55%{transform:skewX(-12deg) translateX(0)}100%{transform:skewX(-12deg) translateX(135%)}}.slideName{position:absolute;left:58px;bottom:42px;z-index:22;font-size:14px;font-weight:800;letter-spacing:.18em;color:rgba(255,216,61,.75);text-transform:uppercase;text-shadow:0 2px 10px #000}.slideNo{position:absolute;right:56px;bottom:42px;z-index:22;font-size:18px;font-weight:700;color:#ffffff85;text-shadow:0 2px 10px #000}.progress{position:absolute;left:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:40;box-shadow:0 0 24px rgba(255,216,61,.7);transition:width .35s ease}.dots{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:22;display:flex;gap:7px;max-width:1320px;flex-wrap:wrap;justify-content:center}.dot{width:6px;height:6px;border-radius:99px;background:#ffffff3a;border:1px solid rgba(255,216,61,.22)}.dot.on{width:26px;background:#ffd83d;box-shadow:0 0 16px rgba(255,216,61,.55)}#controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;opacity:0;transition:.2s}.ui #controls{opacity:1}button,a.btn{border:1px solid #ffffff30;background:#111c;color:#fff;border-radius:999px;padding:11px 17px;font:700 13px Arial;text-decoration:none;backdrop-filter:blur(10px)}button.primary,a.primary{background:#ffd83d!important;color:#000!important}.hint{position:fixed;right:18px;top:18px;z-index:101;color:#ffffffb0;font-size:12px;opacity:0;background:#0009;padding:8px 12px;border-radius:999px}.ui .hint{opacity:1}.lunchSlide{position:absolute;inset:0;background:radial-gradient(circle at 50% 22%,rgba(255,216,61,.16),transparent 32%),linear-gradient(180deg,#050505,#0a0804,#020202);display:flex;align-items:center;justify-content:center;text-align:center}.lunchWrap{position:relative;z-index:2}.lunchTitle{font-size:92px;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.lunchTitle span{color:#ffd83d}.timerBox{margin:52px auto 0;min-width:900px;padding:34px 66px 39px;border-radius:34px;border:2px solid rgba(255,216,61,.42);background:linear-gradient(180deg,rgba(0,0,0,.82),rgba(18,14,8,.94));box-shadow:0 0 42px rgba(255,216,61,.18),inset 0 0 45px rgba(255,216,61,.07)}#lunchTimer{font-size:152px;line-height:1;font-weight:900;color:#ffd83d;font-variant-numeric:tabular-nums}#lunchSub{margin-top:38px;font-size:42px;letter-spacing:.04em}.lunchReturn{margin-top:18px;font-size:24px;color:rgba(255,216,61,.9);font-weight:800;letter-spacing:.10em;text-transform:uppercase}.slide[data-kind='lunch'] .slideName,.slide[data-kind='lunch'] .slideNo{display:none}.marketSlide{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:56px 64px;background:radial-gradient(circle at 52% 18%,rgba(255,216,61,.12),transparent 30%),linear-gradient(135deg,#050505,#0b0b08 55%,#030303)}.marketInner{width:88%;height:82%;border:1px solid rgba(255,216,61,.24);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.01));box-shadow:0 30px 100px rgba(0,0,0,.68),inset 0 0 60px rgba(255,216,61,.025);padding:46px 52px;position:relative;overflow:hidden}.marketKicker{font-size:18px;letter-spacing:.23em;text-transform:uppercase;color:var(--gold);font-weight:900}.marketTitle{margin-top:10px;font-size:46px;line-height:1;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.bars{margin-top:34px;display:grid;gap:16px}.bar{display:grid;grid-template-columns:305px minmax(0,1fr) 210px;align-items:center;gap:24px;min-height:58px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.055)}.name{display:flex;align-items:center;gap:16px;font-size:25px;font-weight:900;white-space:nowrap}.logoWrap{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:#111;font-weight:900}.track{height:22px;background:rgba(255,255,255,.11);overflow:hidden;border-radius:999px;border:1px solid rgba(255,255,255,.07)}.fill{height:100%;background:linear-gradient(90deg,#ffe052,#ffd12f,#f4b31c);box-shadow:0 0 18px rgba(255,216,61,.32);transform-origin:left}.active .fill{animation:grow 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.val{justify-self:start;font-size:16px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.74);font-weight:800;white-space:nowrap;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035)}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><canvas id="dust" width="1920" height="1080"></canvas><div id="slides"></div><div class="grain"></div><div class="wipe" id="wipe"></div><div class="progress" id="progress"></div><div class="dots" id="dots"></div></div></div>
<div id="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button><a class="btn" href="organizar/" target="_blank">Organizar</a></div><div class="hint">← → / espaço • F tela cheia • R efeito • L reinicia almoço • O organizar</div>
<script>
const VERSION='efeitos-market-20260923-1334';
const BASE='../apresentacao/assets/';
const STORAGE_KEY='imersao_final_slide_order_v2';
const SLIDES=[
{id:'abertura',src:'1.jpg',label:'Abertura',kind:'opening'},
{id:'s2',src:'2.jpg',label:'Imersão'},
{id:'s3',src:'3.jpg',label:'Imersão'},
{id:'s4',src:'4.jpg',label:'Imersão'},
{id:'s5',src:'5.jpg',label:'Imersão'},
{id:'formas',src:'6.jpg',label:'Formas de vender online'},
{id:'ml',src:'16.jpg',label:'Mercado Livre — Estratégias'},
{id:'analise1',src:'9.jpg',label:'Análise de Mercado'},
{id:'analise2',src:'10.jpg',label:'Análise de Mercado'},
{id:'produto',src:'11.jpg',label:'Desenvolvimento de Produto'},
{id:'tvx',src:'12.jpg',label:'TVX'},
{id:'almoco',kind:'lunch',label:'Almoço'},
{id:'patrocinador',src:'14.jpg',label:'Patrocinador'},
{id:'import1',src:'7.jpg',label:'Importação'},
{id:'import2',src:'8.jpg',label:'Importação'},
{id:'argo',src:'15.jpg',label:'Argo'},
{id:'formulario',src:'62c967bd-f9ee-431b-8196-d00fcce24538.png',label:'Formulário'},
{id:'imersao18',src:'18.jpg',label:'Imersão'},
{id:'mentoria',src:'Apresentação A - Gui Nonato (16).jpg',label:'Mentoria'},
{id:'qr',src:'Apresentação A - Gui Nonato (17).jpg',label:'QR Code'}
];
const MARKET={id:'market',kind:'market',label:'Marketplaces'};
const DEFAULT_ORDER=SLIDES.map(s=>s.id);
function getOrderedSlides(){let ids;try{ids=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){}if(!Array.isArray(ids))ids=DEFAULT_ORDER;const map=new Map(SLIDES.map(s=>[s.id,s]));const used=new Set();let ordered=[];ids.forEach(id=>{if(map.has(id)&&!used.has(id)){ordered.push(map.get(id));used.add(id)}});SLIDES.forEach(s=>{if(!used.has(s.id))ordered.push(s)});ordered=ordered.filter(s=>s.id!=='market');const pos=ordered.findIndex(s=>s.id==='formas');if(pos>=0)ordered.splice(pos+1,0,MARKET);else ordered.splice(6,0,MARKET);return ordered}
const ordered=getOrderedSlides();
const marketHTML=`<div class="marketSlide"><div class="marketInner"><div class="marketKicker">Principais marketplaces do Brasil</div><div class="marketTitle">Comparativo de faturamento geral</div><div class="bars"><div class="bar"><div class="name"><span class="logoWrap">ML</span><span>Mercado Livre</span></div><div class="track"><div class="fill" style="width:100%"></div></div><div class="val">Referência</div></div><div class="bar"><div class="name"><span class="logoWrap">S</span><span>Shopee</span></div><div class="track"><div class="fill" style="width:72%"></div></div><div class="val">Alto volume</div></div><div class="bar"><div class="name"><span class="logoWrap">A</span><span>Amazon</span></div><div class="track"><div class="fill" style="width:58%"></div></div><div class="val">Crescimento</div></div><div class="bar"><div class="name"><span class="logoWrap">M</span><span>Magalu</span></div><div class="track"><div class="fill" style="width:42%"></div></div><div class="val">Varejo + marketplace</div></div><div class="bar"><div class="name"><span class="logoWrap">TT</span><span>TikTok Shop</span></div><div class="track"><div class="fill" style="width:30%"></div></div><div class="val">Forte crescimento</div></div></div></div></div>`;
const LUNCH_DURATION=60*60;let lunchEndAt=null,lunchTimerInterval=null;
function formatTime(t){const h=String(Math.floor(t/3600)).padStart(2,'0'),m=String(Math.floor((t%3600)/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');return `${h}:${m}:${s}`}
function human(t){const h=Math.floor(t/3600),m=Math.floor((t%3600)/60);if(h>0&&m>0)return `Retornamos em ${h} hora e ${m} minutos`;if(h>0)return `Retornamos em ${h} hora`;if(m>0)return `Retornamos em ${m} minutos`;return 'Estamos voltando'}
function updateLunchTimer(){if(!lunchEndAt)return;const left=Math.max(0,Math.ceil((lunchEndAt-Date.now())/1000));const timer=document.getElementById('lunchTimer'),sub=document.getElementById('lunchSub'),ret=document.getElementById('lunchReturn');if(timer)timer.textContent=formatTime(left);if(sub)sub.textContent=left>0?human(left):'Estamos voltando';if(ret){const d=new Date(lunchEndAt);ret.textContent=left>0?'RETORNO PREVISTO: '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'RETORNO AGORA'}if(left<=0&&lunchTimerInterval){clearInterval(lunchTimerInterval);lunchTimerInterval=null}}
function startLunchTimer(reset=false){if(reset||!lunchEndAt)lunchEndAt=Date.now()+LUNCH_DURATION*1000;updateLunchTimer();if(lunchTimerInterval)clearInterval(lunchTimerInterval);lunchTimerInterval=setInterval(updateLunchTimer,1000)}
function slideHTML(s,i){if(s.kind==='market')return `<section class="slide ${i===0?'active':''}" data-kind="market">${marketHTML}<div class="frame"></div><div class="slideName">${s.label}</div><div class="slideNo">${String(i+1).padStart(2,'0')}</div></section>`;if(s.kind==='lunch')return `<section class="slide ${i===0?'active':''}" data-kind="lunch"><div class="lunchSlide"><div class="lunchWrap"><div class="lunchTitle">PAUSA PARA O <span>ALMOÇO</span></div><div class="timerBox"><div id="lunchTimer">01:00:00</div></div><div id="lunchSub">Retornamos em 1 hora</div><div class="lunchReturn" id="lunchReturn"></div></div></div><div class="frame"></div><div class="slideName">${s.label}</div><div class="slideNo">${String(i+1).padStart(2,'0')}</div></section>`;const url=BASE+encodeURIComponent(s.src).replace(/%2F/g,'/')+'?v='+VERSION;return `<section class="slide ${i===0?'active':''}" data-kind="${s.kind||'image'}"><div class="photo"><div class="back" style="background-image:url('${url}')"></div><img src="${url}" alt="${s.label}" loading="${i<4?'eager':'lazy'}"></div>${i===0?'<div class="mist"></div><div class="beam left"></div><div class="beam right"></div>':''}<div class="frame"></div><div class="slideName">${s.label}</div><div class="slideNo">${String(i+1).padStart(2,'0')}</div></section>`}
const wrap=document.getElementById('slides'),dots=document.getElementById('dots');wrap.innerHTML=ordered.map(slideHTML).join('');dots.innerHTML=ordered.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('');
const slides=[...document.querySelectorAll('.slide')],dotEls=[...document.querySelectorAll('.dot')],stage=document.getElementById('stage'),progress=document.getElementById('progress'),wipe=document.getElementById('wipe');let idx=0,uiTimer,busy=false;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
function showUI(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.remove('ui'),1600)}addEventListener('mousemove',showUI);showUI();
function restartFx(slide){slide.querySelectorAll('.beam,.mist,.fill').forEach(el=>{el.style.animation='none';void el.offsetHeight;el.style.animation=''})}
function afterSlide(){progress.style.width=((idx+1)/slides.length*100)+'%';restartFx(slides[idx]);if(ordered[idx].kind==='lunch')startLunchTimer(false)}
function go(n,force=false){n=Math.max(0,Math.min(slides.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{slides[idx].classList.remove('active');dotEls[idx].classList.remove('on');idx=n;slides[idx].classList.add('active');dotEls[idx].classList.add('on');afterSlide()},310);setTimeout(()=>{busy=false},860)}
progress.style.width=(1/slides.length*100)+'%';document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='r')go(idx,true);if(e.key.toLowerCase()==='l')startLunchTimer(true);if(e.key.toLowerCase()==='o')open('organizar/','_blank')});
const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');const pts=Array.from({length:250},()=>({x:Math.random()*1920,y:Math.random()*1080,r:.6+Math.random()*2.8,v:.22+Math.random()*.62,dx:(Math.random()-.5)*.28,a:.05+Math.random()*.25}));
(function dustLoop(){ctx.clearRect(0,0,1920,1080);if(idx===0){for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-16;p.x=Math.random()*1920;p.dx=(Math.random()-.5)*.28}if(p.x<-25)p.x=1945;if(p.x>1945)p.x=-25;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*1.55})`;ctx.fill()}}requestAnimationFrame(dustLoop)})();
restartFx(slides[0]);
</script>
</body>
</html>
