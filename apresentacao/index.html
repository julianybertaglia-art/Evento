<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Imersão Ecommerce — Apresentação</title>
<style>
:root{--stage-w:3300px;--stage-h:1080px;--gold:#ffd83d;--gold2:#f4b31c;--bg:#000}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{cursor:none}.ui{cursor:default}
#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:3300px;height:1080px;transform-origin:center center;background:#000;overflow:hidden;box-shadow:0 0 90px #000}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.012);filter:blur(2px);transition:opacity .42s ease,transform .6s cubic-bezier(.16,1,.3,1),filter .45s ease;background:#000;overflow:hidden}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:none}.slide-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:1}.slide:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.22) 100%)}
#dust{position:absolute;inset:0;width:3300px;height:1080px;z-index:8;pointer-events:none;opacity:.95}.grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.10;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");animation:grain .25s steps(2) infinite}@keyframes grain{0%{transform:translate(0)}50%{transform:translate(-1%,1%)}100%{transform:translate(1%,-1%)}}
.beam{position:absolute;top:-8px;width:8px;height:1110px;border-radius:999px;z-index:7;opacity:0;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,235,150,0),rgba(255,221,95,.98) 12%,rgba(255,246,206,1) 48%,rgba(255,214,58,.98) 82%,rgba(255,221,95,0));box-shadow:0 0 12px rgba(255,207,52,.9),0 0 34px rgba(255,178,0,.65),0 0 92px rgba(255,178,0,.34);mix-blend-mode:screen}.beam:before{content:"";position:absolute;left:50%;top:-10px;width:46px;height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,252,225,1),rgba(255,217,85,.85) 34%,rgba(255,217,85,0) 76%);opacity:0;filter:blur(1px)}.beam.left{left:1010px;transform:rotate(15.8deg) scaleY(.04)}.beam.right{left:2475px;transform:rotate(16.8deg) scaleY(.04)}.active .beam.left{animation:igniteLeft 1.2s cubic-bezier(.16,1,.3,1) .08s forwards,pulseLeft 2.8s ease-in-out 1.38s infinite}.active .beam.right{animation:igniteRight 1.2s cubic-bezier(.16,1,.3,1) .18s forwards,pulseRight 2.8s ease-in-out 1.48s infinite}.active .beam:before{animation:head 1.1s ease-out .12s forwards}@keyframes igniteLeft{0%{opacity:0;transform:rotate(15.8deg) scaleY(.04)}38%{opacity:1;transform:rotate(15.8deg) scaleY(.42)}72%{opacity:1;transform:rotate(15.8deg) scaleY(1.03)}100%{opacity:.95;transform:rotate(15.8deg) scaleY(1)}}@keyframes igniteRight{0%{opacity:0;transform:rotate(16.8deg) scaleY(.04)}38%{opacity:1;transform:rotate(16.8deg) scaleY(.42)}72%{opacity:1;transform:rotate(16.8deg) scaleY(1.03)}100%{opacity:.95;transform:rotate(16.8deg) scaleY(1)}}@keyframes pulseLeft{50%{opacity:1;box-shadow:0 0 18px rgba(255,207,52,.95),0 0 52px rgba(255,178,0,.7),0 0 112px rgba(255,178,0,.38)}}@keyframes pulseRight{50%{opacity:1;box-shadow:0 0 18px rgba(255,207,52,.95),0 0 52px rgba(255,178,0,.7),0 0 112px rgba(255,178,0,.38)}}@keyframes head{0%{opacity:0;transform:translateX(-50%) scale(.45)}24%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.8)}}
.slideNo{position:absolute;right:82px;bottom:54px;z-index:20;font-size:23px;font-weight:700;letter-spacing:.18em;color:#ffffff55}.progress{position:absolute;left:0;bottom:0;height:7px;background:var(--gold);z-index:30;box-shadow:0 0 20px rgba(255,216,61,.5);transition:width .3s ease}.wipe{position:absolute;inset:-20% -10%;z-index:40;background:var(--gold2);transform:skewX(-12deg) translateX(-130%);pointer-events:none}.wipe.go{animation:wipe .72s cubic-bezier(.7,0,.2,1)}@keyframes wipe{0%{transform:skewX(-12deg) translateX(-130%)}45%,55%{transform:skewX(-12deg) translateX(0)}100%{transform:skewX(-12deg) translateX(130%)}}
#controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;opacity:0;transition:.2s}.ui #controls{opacity:1}#controls button{border:1px solid #ffffff26;background:#111b;color:#fff;border-radius:999px;padding:10px 16px;font:700 12px Arial}.primary{background:#ffd83d!important;color:#000!important}#hint{position:fixed;right:18px;bottom:22px;z-index:100;color:#ffffff80;font-size:11px;opacity:0;transition:.2s}.ui #hint{opacity:1}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
<canvas id="dust" width="3300" height="1080"></canvas>
<div id="slides"></div>
<div class="grain"></div><div class="wipe" id="wipe"></div><div class="progress" id="progress"></div>
</div></div>
<div id="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button></div><div id="hint">← → / espaço • F tela cheia • R reinicia efeito</div>
<script>
const SLIDES=Array.from({length:20},(_,i)=>({img:`assets/${i+1}.jpg`,effects:i===0?['beams','dust']:['dust']}));
const wrap=document.getElementById('slides');
wrap.innerHTML=SLIDES.map((s,i)=>`<section class="slide ${i===0?'active':''}" data-effects="${s.effects.join(' ')}"><img class="slide-img" src="${s.img}" alt="Slide ${i+1}" loading="${i<3?'eager':'lazy'}">${i===0?'<div class="beam left"></div><div class="beam right"></div>':''}<div class="slideNo">${String(i+1).padStart(2,'0')}</div></section>`).join('');
const slides=[...document.querySelectorAll('.slide')],stage=document.getElementById('stage'),wipe=document.getElementById('wipe'),progress=document.getElementById('progress');let idx=0,busy=false,uiTimer;
function fit(){const s=Math.min(innerWidth/3300,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
function showUI(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.remove('ui'),1800)}addEventListener('mousemove',showUI);showUI();
function restart(slide){slide.querySelectorAll('.beam').forEach(e=>{e.style.animation='none';e.offsetHeight;e.style.animation=''})}
function go(n,force=false){n=Math.max(0,Math.min(slides.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{slides[idx].classList.remove('active');idx=n;slides[idx].classList.add('active');progress.style.width=((idx+1)/slides.length*100)+'%';restart(slides[idx])},330);setTimeout(()=>busy=false,780)}
progress.style.width=(1/slides.length*100)+'%';restart(slides[0]);document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='r')go(idx,true)});
const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');const pts=Array.from({length:150},()=>({x:Math.random()*3300,y:Math.random()*1080,r:.8+Math.random()*2.8,v:.18+Math.random()*.42,dx:(Math.random()-.5)*.22,a:.05+Math.random()*.23}));
(function loop(){ctx.clearRect(0,0,3300,1080);const hasDust=slides[idx]?.dataset.effects.includes('dust');const mult=hasDust?(idx===0?1:.28):0;for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-14;p.x=Math.random()*3300;p.dx=(Math.random()-.5)*.22}if(p.x<-20)p.x=3320;if(p.x>3320)p.x=-20;if(mult>0){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*mult})`;ctx.fill()}}requestAnimationFrame(loop)})();
</script>
</body>
</html>
