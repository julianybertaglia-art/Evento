<!doctype html>
<html lang='pt-BR'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Imersão Ecommerce — Apresentação</title>
<style>
:root{--gold:#ffd83d;--gold2:#f4b31c;--bg:#030303}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:3300px;height:1080px;transform-origin:center center;background:#000;overflow:hidden;box-shadow:0 0 110px #000}.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.032);filter:blur(6px);transition:opacity .58s ease,transform .88s cubic-bezier(.16,1,.3,1),filter .65s ease;background:#000;overflow:hidden}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:none}.slide-img{position:absolute;inset:-1.2%;width:102.4%;height:102.4%;object-fit:cover;object-position:center;z-index:1;transform:scale(1.01);filter:saturate(1.04) contrast(1.035) brightness(.99)}.slide.active .slide-img{animation:drift 18s ease-in-out forwards}@keyframes drift{to{transform:scale(1.045) translate3d(-16px,-8px,0)}}.slide:before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 52%,rgba(0,0,0,.30) 100%),linear-gradient(90deg,rgba(0,0,0,.16),transparent 22%,transparent 78%,rgba(0,0,0,.16));mix-blend-mode:multiply}.slide:after{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(105deg,transparent 0 39%,rgba(255,232,132,.055) 48%,rgba(255,232,132,.025) 51%,transparent 60%);transform:translateX(-130%);animation:sweep 9s ease-in-out infinite}@keyframes sweep{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}.frame{position:absolute;inset:34px;z-index:10;pointer-events:none;border:1px solid rgba(255,216,61,.18);box-shadow:inset 0 0 58px rgba(255,216,61,.055)}.cornerGlow{position:absolute;z-index:6;pointer-events:none;inset:0;background:radial-gradient(ellipse at 5% 5%,rgba(255,216,61,.12),transparent 24%),radial-gradient(ellipse at 94% 94%,rgba(244,179,28,.10),transparent 28%);opacity:.75}.slideNo{position:absolute;right:82px;bottom:54px;z-index:24;font-size:23px;font-weight:700;letter-spacing:.18em;color:#ffffff66;text-shadow:0 0 14px #000}.slideName{position:absolute;left:84px;bottom:54px;z-index:24;font-size:18px;font-weight:800;letter-spacing:.18em;color:rgba(255,216,61,.72);text-transform:uppercase}.progress{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:40;box-shadow:0 0 28px rgba(255,216,61,.72);transition:width .35s ease}.dots{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:24;display:flex;gap:10px}.dot{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,216,61,.25);transition:.25s}.dot.on{width:34px;background:var(--gold);box-shadow:0 0 18px rgba(255,216,61,.55)}#controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;opacity:0;transition:.2s}body.ui #controls{opacity:1}#controls button{border:1px solid #ffffff26;background:#111b;color:#fff;border-radius:999px;padding:10px 16px;font:700 12px Arial;backdrop-filter:blur(10px)}#controls .primary{background:#ffd83d;color:#000}.marketSlide{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:58px 76px;background:radial-gradient(circle at 52% 18%,rgba(255,216,61,.12),transparent 30%),linear-gradient(135deg,#050505,#0b0b08 55%,#030303)}.marketInner{width:89%;height:82%;border:1px solid rgba(255,216,61,.24);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.01));box-shadow:0 35px 130px rgba(0,0,0,.68),inset 0 0 70px rgba(255,216,61,.025);padding:48px 58px 46px;position:relative;overflow:hidden}.marketKicker{font-size:23px;letter-spacing:.23em;text-transform:uppercase;color:var(--gold);font-weight:900}.marketTitle{margin-top:12px;font-size:68px;line-height:.98;font-weight:900;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap}.bars{margin-top:38px;display:grid;gap:14px}.bar{display:grid;grid-template-columns:390px minmax(0,1fr) 235px;align-items:center;gap:28px;min-height:62px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.055)}.name{display:flex;align-items:center;gap:18px;font-size:31px;font-weight:900;white-space:nowrap}.logoWrap{width:54px;height:54px;flex:0 0 54px;border-radius:14px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.28);overflow:hidden}.marketLogo{width:40px;height:40px;object-fit:contain}.track{height:26px;background:rgba(255,255,255,.11);overflow:hidden;border-radius:999px;border:1px solid rgba(255,255,255,.07)}.fill{height:100%;background:linear-gradient(90deg,#ffe052,#ffd12f,#f4b31c);box-shadow:0 0 18px rgba(255,216,61,.32);transform-origin:left}.active .fill{animation:grow 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.val{justify-self:start;font-size:20px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.74);font-weight:800;white-space:nowrap;padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035)}.pptxWrap{position:absolute;inset:0;z-index:2;background:#050505;display:flex;align-items:center;justify-content:center}.pptxFrame{width:100%;height:100%;border:0;background:#000}.pptxFallback{position:absolute;z-index:3;bottom:80px;left:50%;transform:translateX(-50%);font-size:28px;background:#ffd83d;color:#000;text-decoration:none;font-weight:900;border-radius:999px;padding:18px 34px;box-shadow:0 0 35px rgba(255,216,61,.28)}

#dust{position:absolute;inset:0;width:3300px;height:1080px;z-index:18;pointer-events:none}
.grain{position:absolute;inset:0;z-index:19;pointer-events:none;opacity:.08;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");animation:grainFx .28s steps(2) infinite}
@keyframes grainFx{0%{transform:translate(0)}50%{transform:translate(-1%,1%)}100%{transform:translate(1%,-1%)}}
.wipe{position:absolute;inset:-25% -10%;z-index:50;background:linear-gradient(100deg,transparent 0,rgba(244,179,28,.72) 34%,rgba(255,241,168,.96) 50%,rgba(244,179,28,.72) 66%,transparent 100%);transform:skewX(-12deg) translateX(-130%);pointer-events:none;filter:drop-shadow(0 0 48px rgba(255,216,61,.45))}
.wipe.go{animation:wipeFx .88s cubic-bezier(.7,0,.2,1)}
@keyframes wipeFx{0%{transform:skewX(-12deg) translateX(-130%)}45%,55%{transform:skewX(-12deg) translateX(0)}100%{transform:skewX(-12deg) translateX(130%)}}
.beam{position:absolute;top:-14px;width:10px;height:1120px;border-radius:999px;z-index:16;opacity:0;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,235,150,0),rgba(255,221,95,1) 10%,rgba(255,246,206,1) 48%,rgba(255,214,58,1) 84%,rgba(255,221,95,0));box-shadow:0 0 16px rgba(255,207,52,.95),0 0 42px rgba(255,178,0,.8),0 0 118px rgba(255,178,0,.46),0 0 200px rgba(255,178,0,.16);mix-blend-mode:screen}
.beam.left{left:1010px;transform:rotate(15.8deg) scaleY(.03)}.beam.right{left:2475px;transform:rotate(16.8deg) scaleY(.03)}
.active .beam.left{animation:igniteLeftFx 1.05s cubic-bezier(.16,1,.3,1) .05s forwards,pulseLeftFx 2.4s ease-in-out 1.18s infinite}
.active .beam.right{animation:igniteRightFx 1.05s cubic-bezier(.16,1,.3,1) .13s forwards,pulseRightFx 2.4s ease-in-out 1.28s infinite}
@keyframes igniteLeftFx{0%{opacity:0;transform:rotate(15.8deg) scaleY(.03)}35%{opacity:1;transform:rotate(15.8deg) scaleY(.5)}70%{opacity:1;transform:rotate(15.8deg) scaleY(1.05)}100%{opacity:.88;transform:rotate(15.8deg) scaleY(1)}}
@keyframes igniteRightFx{0%{opacity:0;transform:rotate(16.8deg) scaleY(.03)}35%{opacity:1;transform:rotate(16.8deg) scaleY(.5)}70%{opacity:1;transform:rotate(16.8deg) scaleY(1.05)}100%{opacity:.88;transform:rotate(16.8deg) scaleY(1)}}
@keyframes pulseLeftFx{50%{opacity:.62}}@keyframes pulseRightFx{50%{opacity:.62}}
.mist{position:absolute;left:0;right:0;bottom:-70px;height:320px;z-index:12;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,rgba(255,189,49,.34),rgba(255,189,49,.16) 34%,transparent 72%);filter:blur(16px);opacity:.85;mix-blend-mode:screen}
.active .mist{animation:mistMoveFx 5s ease-in-out infinite}
@keyframes mistMoveFx{50%{opacity:.5;transform:translateY(18px)}}

</style>
</head>
<body>
<div id='viewport'><div id='stage'><canvas id='dust' width='3300' height='1080'></canvas><div id='slides'></div><div class='grain'></div><div class='wipe' id='wipe'></div><div class='progress' id='progress'></div><div class='dots' id='dots'></div></div></div>
<div id='controls'><button id='prev'>◀ Voltar</button><button class='primary' id='full'>Tela cheia</button><button id='next'>Avançar ▶</button></div>
<script>
const SLIDES=[
{src:'assets/1.jpg',kind:'opening',label:'abertura'},
{src:'assets/2.jpg',kind:'image',label:'imersão'},
{src:'assets/3.jpg',kind:'image',label:'imersão'},
{src:'assets/4.jpg',kind:'image',label:'imersão'},
{src:'assets/5.jpg',kind:'image',label:'imersão'},
{src:'assets/6.jpg',kind:'image',label:'imersão'},
{src:null,kind:'market',label:'marketplaces'},
{src:'assets/7.jpg',kind:'image',label:'imersão'},
{src:'assets/8.jpg',kind:'image',label:'imersão'},
{src:'assets/9.jpg',kind:'image',label:'imersão'},
{src:'assets/10.jpg',kind:'image',label:'imersão'},
{src:'assets/11.jpg',kind:'image',label:'imersão'},
{src:'assets/12.jpg',kind:'image',label:'imersão'},
{src:'assets/13.jpg',kind:'image',label:'imersão'},
{src:'assets/14.jpg',kind:'image',label:'imersão'},
{src:'assets/15.jpg',kind:'image',label:'imersão'},
{src:'assets/16.jpg',kind:'image',label:'imersão'},
{src:'assets/62c967bd-f9ee-431b-8196-d00fcce24538.png',kind:'image',label:'formulário'},
{src:'assets/18.jpg',kind:'image',label:'imersão'},
{src:'assets/Apresentação A - Gui Nonato (16).jpg',kind:'closing',label:'mentoria'},
{src:'assets/Apresentação A - Gui Nonato (17).jpg',kind:'image',label:'inscrição'}
];
const marketHTML=`<div class='marketSlide'><div class='marketInner'><div class='marketKicker'>Principais marketplaces do Brasil</div><div class='marketTitle'>Comparativo de faturamento geral</div><div class='bars'><div class='bar'><div class='name'><span class='logoWrap'><img class='marketLogo' src='https://www.google.com/s2/favicons?domain=mercadolivre.com.br&sz=128'></span><span>Mercado Livre</span></div><div class='track'><div class='fill' style='width:100%'></div></div><div class='val'>Referência</div></div><div class='bar'><div class='name'><span class='logoWrap'><img class='marketLogo' src='https://www.google.com/s2/favicons?domain=shopee.com.br&sz=128'></span><span>Shopee</span></div><div class='track'><div class='fill' style='width:72%'></div></div><div class='val'>Alto volume</div></div><div class='bar'><div class='name'><span class='logoWrap'><img class='marketLogo' src='https://www.google.com/s2/favicons?domain=amazon.com.br&sz=128'></span><span>Amazon</span></div><div class='track'><div class='fill' style='width:58%'></div></div><div class='val'>Crescimento</div></div><div class='bar'><div class='name'><span class='logoWrap'><img class='marketLogo' src='https://www.google.com/s2/favicons?domain=magazineluiza.com.br&sz=128'></span><span>Magalu</span></div><div class='track'><div class='fill' style='width:42%'></div></div><div class='val'>Varejo + marketplace</div></div><div class='bar'><div class='name'><span class='logoWrap'><img class='marketLogo' src='https://www.google.com/s2/favicons?domain=tiktok.com&sz=128'></span><span>TikTok Shop</span></div><div class='track'><div class='fill' style='width:30%'></div></div><div class='val'>Forte crescimento</div></div></div></div></div>`;
function pptxHTML(src){const absolute=new URL(src,location.href).href;const viewer='https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(absolute);return `<div class='pptxWrap'><iframe class='pptxFrame' src='${viewer}'></iframe><a class='pptxFallback' href='${src}' target='_blank'>Abrir apresentação</a></div>`}
function content(s,i){if(s.kind==='market')return marketHTML;if(s.kind==='pptx')return pptxHTML(s.src);return `<img class='slide-img' src='${s.src}' alt='Slide ${i+1}' loading='${i<3?'eager':'lazy'}'>`}
const wrap=document.getElementById('slides'),dots=document.getElementById('dots');
wrap.innerHTML=SLIDES.map((s,i)=>`<section class='slide ${i===0?'active':''}' data-kind='${s.kind}'>${content(s,i)}<div class='cornerGlow'></div><div class='frame'></div>${i===0?"<div class='mist'></div><div class='beam left'></div><div class='beam right'></div>":''}<div class='slideName'>${s.label}</div><div class='slideNo'>${String(i+1).padStart(2,'0')}</div></section>`).join('');
dots.innerHTML=SLIDES.map((_,i)=>`<span class='dot ${i===0?'on':''}'></span>`).join('');
const slides=[...document.querySelectorAll('.slide')],dotEls=[...document.querySelectorAll('.dot')],stage=document.getElementById('stage'),progress=document.getElementById('progress'),wipe=document.getElementById('wipe');let idx=0,uiTimer,busy=false;
function fit(){const s=Math.min(innerWidth/3300,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
function showUI(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.remove('ui'),1800)}addEventListener('mousemove',showUI);showUI();
function restartFx(slide){slide.querySelectorAll('.beam,.mist,.fill').forEach(el=>{el.style.animation='none';void el.offsetHeight;el.style.animation=''})}
function go(n,force=false){n=Math.max(0,Math.min(slides.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{slides[idx].classList.remove('active');dotEls[idx].classList.remove('on');idx=n;slides[idx].classList.add('active');dotEls[idx].classList.add('on');progress.style.width=((idx+1)/slides.length*100)+'%';restartFx(slides[idx])},315);setTimeout(()=>{busy=false},900)}
progress.style.width=(1/slides.length*100)+'%';document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='r')go(idx,true)});
const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');
const pts=Array.from({length:360},()=>({x:Math.random()*3300,y:Math.random()*1080,r:.8+Math.random()*3.9,v:.28+Math.random()*.78,dx:(Math.random()-.5)*.34,a:.055+Math.random()*.30}));
(function dustLoop(){ctx.clearRect(0,0,3300,1080);const mult=idx===0?1.85:.16;for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-16;p.x=Math.random()*3300;p.dx=(Math.random()-.5)*.34}if(p.x<-25)p.x=3325;if(p.x>3325)p.x=-25;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*mult})`;ctx.fill()}requestAnimationFrame(dustLoop)})();
restartFx(slides[0]);
</script>
</body>
</html>
