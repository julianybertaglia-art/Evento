<!doctype html>
<html lang="pt-BR">
<head>

<title>Imersão Ecommerce — Apresentação</title>
<style>
:root{--gold:#ffd83d;--gold2:#f4b31c;--dark:#030303}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{cursor:none}.ui{cursor:default}#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:3300px;height:1080px;transform-origin:center center;background:#000;overflow:hidden;box-shadow:0 0 100px #000}.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transform:scale(1.018);filter:blur(3px);transition:opacity .5s ease,transform .75s cubic-bezier(.16,1,.3,1),filter .55s ease;background:#000;overflow:hidden}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:none}.slide-img{position:absolute;inset:-1.2%;width:102.4%;height:102.4%;object-fit:cover;object-position:center;z-index:1;transform:scale(1.01);filter:saturate(1.05) contrast(1.04) brightness(.99)}.slide.active .slide-img{animation:cinemaDrift 18s ease-in-out forwards}.slide.opening .slide-img{filter:saturate(1.12) contrast(1.08) brightness(1.02)}@keyframes cinemaDrift{0%{transform:scale(1.01) translate3d(0,0,0)}100%{transform:scale(1.045) translate3d(-16px,-8px,0)}}.slide:before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 52%,rgba(0,0,0,.28) 100%),linear-gradient(90deg,rgba(0,0,0,.16),transparent 22%,transparent 78%,rgba(0,0,0,.16));mix-blend-mode:multiply}.slide:after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(105deg,transparent 0 40%,rgba(255,232,132,.055) 49%,rgba(255,232,132,.025) 52%,transparent 61%);transform:translateX(-130%);animation:sweep 9s ease-in-out infinite}@keyframes sweep{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}.frame{position:absolute;inset:34px;z-index:10;pointer-events:none;border:1px solid rgba(255,216,61,.18);box-shadow:inset 0 0 58px rgba(255,216,61,.055)}.frame:before,.frame:after{content:"";position:absolute;width:320px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);filter:drop-shadow(0 0 14px rgba(255,216,61,.65))}.frame:before{left:-1px;top:-1px}.frame:after{right:-1px;bottom:-1px;transform:rotate(180deg)}.cornerGlow{position:absolute;z-index:6;pointer-events:none;inset:0;background:radial-gradient(ellipse at 5% 5%,rgba(255,216,61,.12),transparent 24%),radial-gradient(ellipse at 94% 94%,rgba(244,179,28,.10),transparent 28%);opacity:.75}.active .cornerGlow{animation:glowBreath 4.8s ease-in-out infinite}@keyframes glowBreath{50%{opacity:1}}#dust{position:absolute;inset:0;width:3300px;height:1080px;z-index:18;pointer-events:none;opacity:1}.grain{position:absolute;inset:0;z-index:19;pointer-events:none;opacity:.11;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");animation:grain .25s steps(2) infinite}@keyframes grain{0%{transform:translate(0)}50%{transform:translate(-1%,1%)}100%{transform:translate(1%,-1%)}}.beam{position:absolute;top:-14px;width:10px;height:1120px;border-radius:999px;z-index:16;opacity:0;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,235,150,0),rgba(255,221,95,1) 10%,rgba(255,246,206,1) 48%,rgba(255,214,58,1) 84%,rgba(255,221,95,0));box-shadow:0 0 16px rgba(255,207,52,.95),0 0 42px rgba(255,178,0,.8),0 0 118px rgba(255,178,0,.46),0 0 200px rgba(255,178,0,.16);mix-blend-mode:screen}.beam:before{content:"";position:absolute;left:50%;top:-14px;width:62px;height:62px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,252,225,1),rgba(255,225,105,.92) 34%,rgba(255,217,85,0) 78%);opacity:0;filter:blur(1px)}.beam:after{content:"";position:absolute;left:50%;top:0;width:42px;height:330px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,250,220,.9),rgba(255,216,61,.45),transparent);filter:blur(10px);opacity:0}.beam.left{left:1010px;transform:rotate(15.8deg) scaleY(.03)}.beam.right{left:2475px;transform:rotate(16.8deg) scaleY(.03)}.active .beam.left{animation:igniteLeft 1.05s cubic-bezier(.16,1,.3,1) .05s forwards,pulseLeft 2.35s ease-in-out 1.18s infinite}.active .beam.right{animation:igniteRight 1.05s cubic-bezier(.16,1,.3,1) .13s forwards,pulseRight 2.35s ease-in-out 1.28s infinite}.active .beam:before{animation:head .95s ease-out .08s forwards}.active .beam:after{animation:tail 1s ease-out .14s forwards}@keyframes igniteLeft{0%{opacity:0;transform:rotate(15.8deg) scaleY(.03)}32%{opacity:1;transform:rotate(15.8deg) scaleY(.48)}66%{opacity:1;transform:rotate(15.8deg) scaleY(1.05)}100%{opacity:1;transform:rotate(15.8deg) scaleY(1)}}@keyframes igniteRight{0%{opacity:0;transform:rotate(16.8deg) scaleY(.03)}32%{opacity:1;transform:rotate(16.8deg) scaleY(.48)}66%{opacity:1;transform:rotate(16.8deg) scaleY(1.05)}100%{opacity:1;transform:rotate(16.8deg) scaleY(1)}}@keyframes pulseLeft{50%{opacity:.74;box-shadow:0 0 22px rgba(255,207,52,1),0 0 70px rgba(255,178,0,.82),0 0 142px rgba(255,178,0,.54),0 0 240px rgba(255,178,0,.22)}}@keyframes pulseRight{50%{opacity:.74;box-shadow:0 0 22px rgba(255,207,52,1),0 0 70px rgba(255,178,0,.82),0 0 142px rgba(255,178,0,.54),0 0 240px rgba(255,178,0,.22)}}@keyframes head{0%{opacity:0;transform:translateX(-50%) scale(.38)}20%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(2.1)}}@keyframes tail{0%{opacity:0;height:30px}22%{opacity:.9}100%{opacity:0;height:380px}}.mist{position:absolute;left:0;right:0;bottom:-70px;height:320px;z-index:12;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,rgba(255,189,49,.34),rgba(255,189,49,.16) 34%,transparent 72%);filter:blur(16px);opacity:.9;mix-blend-mode:screen}.active .mist{animation:mistMove 5s ease-in-out infinite}@keyframes mistMove{50%{opacity:.58;transform:translateY(18px)}}.slideNo{position:absolute;right:82px;bottom:54px;z-index:24;font-size:23px;font-weight:700;letter-spacing:.18em;color:#ffffff66;text-shadow:0 0 14px #000}.slideName{position:absolute;left:84px;bottom:54px;z-index:24;font-size:18px;font-weight:800;letter-spacing:.18em;color:rgba(255,216,61,.72);text-transform:uppercase}.progress{position:absolute;left:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:40;box-shadow:0 0 28px rgba(255,216,61,.72);transition:width .35s ease}.dots{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:24;display:flex;gap:10px}.dot{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,216,61,.25);transition:.25s}.dot.on{width:34px;background:var(--gold);box-shadow:0 0 18px rgba(255,216,61,.55)}.wipe{position:absolute;inset:-25% -10%;z-index:50;background:linear-gradient(100deg,transparent 0,var(--gold2) 34%,#fff0a8 50%,var(--gold2) 66%,transparent 100%);transform:skewX(-12deg) translateX(-130%);pointer-events:none;filter:drop-shadow(0 0 42px rgba(255,216,61,.42))}.wipe.go{animation:wipe .78s cubic-bezier(.7,0,.2,1)}@keyframes wipe{0%{transform:skewX(-12deg) translateX(-130%)}45%,55%{transform:skewX(-12deg) translateX(0)}100%{transform:skewX(-12deg) translateX(130%)}}#controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;opacity:0;transition:.2s}.ui #controls{opacity:1}#controls button{border:1px solid #ffffff26;background:#111b;color:#fff;border-radius:999px;padding:10px 16px;font:700 12px Arial;backdrop-filter:blur(10px)}.primary{background:#ffd83d!important;color:#000!important}#hint{position:fixed;right:18px;bottom:22px;z-index:100;color:#ffffff80;font-size:11px;opacity:0;transition:.2s}.ui #hint{opacity:1}.marketSlide{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:80px;background:radial-gradient(circle at 50% 20%,rgba(255,216,61,.22),transparent 34%),linear-gradient(135deg,#050505,#101008 52%,#030303)}.marketInner{width:86%;height:78%;border:1px solid rgba(255,216,61,.36);background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018));box-shadow:0 35px 130px rgba(0,0,0,.66),inset 0 0 60px rgba(255,216,61,.045);padding:70px;position:relative;overflow:hidden}.marketInner:after{content:"";position:absolute;right:-140px;top:-160px;width:560px;height:560px;background:radial-gradient(circle,rgba(255,216,61,.18),transparent 68%);filter:blur(8px)}.marketKicker{font-size:32px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:800}.marketTitle{margin-top:22px;font-size:96px;line-height:.94;font-weight:900;letter-spacing:-.06em;text-transform:uppercase}.bars{margin-top:68px;display:grid;gap:24px}.bar{display:grid;grid-template-columns:340px 1fr 240px;align-items:center;gap:28px;font-weight:800}.name{font-size:38px}.track{height:44px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:999px;border:1px solid rgba(255,255,255,.08)}.fill{height:100%;background:linear-gradient(90deg,#ffd83d,#f4b31c);box-shadow:0 0 34px rgba(255,216,61,.66);transform-origin:left;animation:grow 1s cubic-bezier(.16,1,.3,1) forwards}.val{font-size:31px;color:#fff9}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qaSlide{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:78px;background:radial-gradient(circle at 72% 18%,rgba(255,216,61,.15),transparent 30%),radial-gradient(circle at 18% 88%,rgba(244,179,28,.08),transparent 28%),linear-gradient(135deg,#030303,#090907 52%,#020202)}
.qaInner{width:86%;height:76%;position:relative;display:flex;flex-direction:column;justify-content:center;padding:70px 86px;border:1px solid rgba(255,216,61,.24);background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:0 35px 130px rgba(0,0,0,.62),inset 0 0 70px rgba(255,216,61,.035);overflow:hidden}
.qaInner:after{content:"";position:absolute;right:-150px;top:-180px;width:650px;height:650px;background:radial-gradient(circle,rgba(255,216,61,.14),transparent 68%);filter:blur(8px);pointer-events:none}
.qaKicker{font-size:27px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:900}
.qaTitle{margin-top:24px;font-size:112px;line-height:.94;font-weight:900;letter-spacing:-.055em;text-transform:uppercase;max-width:2200px}
.qaSubtitle{margin-top:34px;font-size:42px;line-height:1.35;color:rgba(255,255,255,.72);font-weight:600;max-width:1900px}
.qaRule{width:240px;height:7px;margin-top:42px;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 28px rgba(255,216,61,.35)}
.qaQuestions{margin-top:24px;display:grid;gap:24px;position:relative;z-index:2}
.qaQuestion{display:grid;grid-template-columns:135px 1fr;align-items:center;gap:34px;padding:24px 34px;border-bottom:1px solid rgba(255,255,255,.10)}
.qaQuestion:last-child{border-bottom:0}
.qaNum{font-size:30px;font-weight:900;letter-spacing:.12em;color:var(--gold)}
.qaText{font-size:48px;line-height:1.16;font-weight:800;letter-spacing:-.02em;color:#fff}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><canvas id="dust" width="3300" height="1080"></canvas><div id="slides"></div><div class="grain"></div><div class="wipe" id="wipe"></div><div class="progress" id="progress"></div><div class="dots" id="dots"></div></div></div>
<div id="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button></div><div id="hint">← → / espaço • F tela cheia • R reinicia efeito</div>
<script>
const SLIDES=[
  {src:'assets/1.jpg',kind:'opening',label:'abertura'},
  {src:'assets/2.jpg',kind:'image',label:'imersão'},
  {src:'assets/3.jpg',kind:'image',label:'imersão'},
  {src:'assets/4.jpg',kind:'image',label:'imersão'},
  {src:'assets/5.jpg',kind:'image',label:'imersão'},
  {src:null,kind:'market',label:'marketplaces'},
  {src:'assets/6.jpg',kind:'image',label:'imersão'},
  {src:'assets/7.jpg',kind:'image',label:'imersão'},
  {src:'assets/8.jpg',kind:'image',label:'imersão'},
  {src:'assets/9.jpg',kind:'image',label:'imersão'},
  {src:'assets/10.jpg',kind:'image',label:'imersão'},
  {src:'assets/11.jpg',kind:'image',label:'imersão'},
  {src:'assets/12.jpg',kind:'image',label:'imersão'},
  {src:'assets/13.jpg',kind:'image',label:'imersão'},
  {src:'assets/14.jpg',kind:'image',label:'imersão'},
  {src:'assets/15.jpg',kind:'image',label:'imersão'},
  {src:'assets/16.jpg',kind:'image',label:'imersão'},
  {src:'assets/62c967bd-f9ee-431b-8196-d00fcce24538.png',kind:'image',label:'formulário'},
  {src:'assets/18.jpg',kind:'image',label:'imersão'},
  {src:null,kind:'qa-open',label:'conversa aberta'},
  {src:null,kind:'qa-list',label:'conversa aberta',questions:['Pergunta selecionada','Pergunta selecionada','Pergunta selecionada']},
  {src:null,kind:'qa-list',label:'conversa aberta',questions:['Pergunta selecionada','Pergunta selecionada']},
  {src:'assets/Apresentação A - Gui Nonato (15).jpg',kind:'closing',label:'mentoria'}
];
const marketHTML=`<div class="marketSlide"><div class="marketInner"><div class="marketKicker">Principais marketplaces do Brasil</div><div class="marketTitle">Comparativo de faturamento geral</div><div class="bars"><div class="bar"><div class="name">Mercado Livre</div><div class="track"><div class="fill" style="width:100%"></div></div><div class="val">referência</div></div><div class="bar"><div class="name">Shopee</div><div class="track"><div class="fill" style="width:72%"></div></div><div class="val">alto volume</div></div><div class="bar"><div class="name">Amazon</div><div class="track"><div class="fill" style="width:58%"></div></div><div class="val">crescimento</div></div><div class="bar"><div class="name">Magalu</div><div class="track"><div class="fill" style="width:42%"></div></div><div class="val">varejo + marketplace</div></div><div class="bar"><div class="name">Americanas</div><div class="track"><div class="fill" style="width:30%"></div></div><div class="val">recuperação</div></div></div></div></div>`;
const qaOpenHTML=`<div class="qaSlide"><div class="qaInner"><div class="qaKicker">Imersão Ecommerce</div><div class="qaTitle">Conversa Aberta</div><div class="qaRule"></div><div class="qaSubtitle">Algumas das perguntas enviadas durante a Imersão.</div></div></div>`;
const qaListHTML=s=>`<div class="qaSlide"><div class="qaInner"><div class="qaKicker">Perguntas selecionadas</div><div class="qaQuestions">${s.questions.map((q,j)=>`<div class="qaQuestion"><div class="qaNum">${String(j+1+(s.questions.length===2?3:0)).padStart(2,'0')}</div><div class="qaText">${q}</div></div>`).join('')}</div></div></div>`;
const slideContent=(s,i)=>s.kind==='market'?marketHTML:s.kind==='qa-open'?qaOpenHTML:s.kind==='qa-list'?qaListHTML(s):`<img class="slide-img" src="${s.src}" alt="Slide ${i+1}" loading="${i<3?'eager':'lazy'}">`;
const wrap=document.getElementById('slides');const dots=document.getElementById('dots');wrap.innerHTML=SLIDES.map((s,i)=>`<section class="slide ${i===0?'active':''} ${s.kind==='opening'?'opening':''}" data-kind="${s.kind}" data-effects="${i===0?'beams dust':'dust'}">${slideContent(s,i)}<div class="cornerGlow"></div><div class="frame"></div>${i===0?'<div class="mist"></div><div class="beam left"></div><div class="beam right"></div>':''}<div class="slideName">${s.label}</div><div class="slideNo">${String(i+1).padStart(2,'0')}</div></section>`).join('');dots.innerHTML=SLIDES.map((_,i)=>`<span class="dot ${i===0?'on':''}"></span>`).join('');
const slides=[...document.querySelectorAll('.slide')],dotEls=[...document.querySelectorAll('.dot')],stage=document.getElementById('stage'),wipe=document.getElementById('wipe'),progress=document.getElementById('progress');let idx=0,busy=false,uiTimer;function fit(){const s=Math.min(innerWidth/3300,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();function showUI(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.remove('ui'),1800)}addEventListener('mousemove',showUI);showUI();function restart(slide){slide.querySelectorAll('.beam,.fill,.mist').forEach(e=>{e.style.animation='none';e.offsetHeight;e.style.animation=''})}function go(n,force=false){n=Math.max(0,Math.min(slides.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{slides[idx].classList.remove('active');dotEls[idx].classList.remove('on');idx=n;slides[idx].classList.add('active');dotEls[idx].classList.add('on');progress.style.width=((idx+1)/slides.length*100)+'%';restart(slides[idx])},330);setTimeout(()=>busy=false,820)}progress.style.width=(1/slides.length*100)+'%';restart(slides[0]);document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='r')go(idx,true)});
const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');const pts=Array.from({length:230},()=>({x:Math.random()*3300,y:Math.random()*1080,r:.7+Math.random()*3.2,v:.18+Math.random()*.55,dx:(Math.random()-.5)*.30,a:.035+Math.random()*.24}));(function loop(){ctx.clearRect(0,0,3300,1080);const mult=idx===0?1.22:.24;for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-16;p.x=Math.random()*3300;p.dx=(Math.random()-.5)*.30}if(p.x<-25)p.x=3325;if(p.x>3325)p.x=-25;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*mult})`;ctx.fill()}requestAnimationFrame(loop)})();
</script>
</body>
</html>
