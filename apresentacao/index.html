<!doctype html>
<html lang="pt-BR">
<head>

<title>Imersão Ecommerce — Apresentação</title>
<style>
:root{--gold:#ffd83d;--gold2:#f4b31c;--bg:#030303}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}body{cursor:none}.ui{cursor:default}#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:#000;overflow:hidden;box-shadow:0 0 90px #000;isolation:isolate}#slides{position:absolute;inset:0;z-index:1}.slide{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transform:scale(1.026);filter:blur(5px);transition:opacity .58s ease,transform .86s cubic-bezier(.16,1,.3,1),filter .62s ease;background:#000;overflow:hidden}.slide.active{opacity:1;pointer-events:auto;transform:scale(1);filter:none}.imageSlide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050505}.imageBack{position:absolute;inset:-42px;background-position:center;background-size:cover;filter:blur(30px) brightness(.48) saturate(1.18);transform:scale(1.08);opacity:.95}.imageSlide:after{content:"";position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(0,0,0,.22) 100%),linear-gradient(180deg,rgba(0,0,0,.42),transparent 18%,transparent 82%,rgba(0,0,0,.42));pointer-events:none}.slide-img{position:relative;z-index:3;width:100%;height:auto;max-height:100%;object-fit:contain;display:block;box-shadow:0 0 42px rgba(0,0,0,.58);transform:scale(1.002);filter:saturate(1.04) contrast(1.035) brightness(.99)}.slide.active .slide-img{animation:drift 18s ease-in-out forwards}@keyframes drift{to{transform:scale(1.025) translate3d(-7px,-4px,0)}}.slide:before{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 56%,rgba(0,0,0,.22) 100%),linear-gradient(90deg,rgba(0,0,0,.10),transparent 22%,transparent 78%,rgba(0,0,0,.10));mix-blend-mode:multiply}.slide:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(105deg,transparent 0 39%,rgba(255,232,132,.055) 48%,rgba(255,232,132,.025) 51%,transparent 60%);transform:translateX(-130%);animation:sweep 9s ease-in-out infinite}@keyframes sweep{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}.frame{position:absolute;inset:24px;z-index:10;pointer-events:none;border:1px solid rgba(255,216,61,.16);box-shadow:inset 0 0 48px rgba(255,216,61,.05)}.frame:before,.frame:after{content:"";position:absolute;width:220px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);filter:drop-shadow(0 0 12px rgba(255,216,61,.58))}.frame:before{left:-1px;top:-1px}.frame:after{right:-1px;bottom:-1px;transform:rotate(180deg)}.cornerGlow{position:absolute;z-index:6;pointer-events:none;inset:0;background:radial-gradient(ellipse at 5% 5%,rgba(255,216,61,.11),transparent 25%),radial-gradient(ellipse at 94% 94%,rgba(244,179,28,.09),transparent 28%);opacity:.75}.slideNo{position:absolute;right:56px;bottom:42px;z-index:24;font-size:18px;font-weight:700;letter-spacing:.18em;color:#ffffff66;text-shadow:0 0 12px #000}.slideName{position:absolute;left:58px;bottom:42px;z-index:24;font-size:14px;font-weight:800;letter-spacing:.18em;color:rgba(255,216,61,.72);text-transform:uppercase}.progress{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:40;box-shadow:0 0 24px rgba(255,216,61,.7);transition:width .35s ease}.dots{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:24;display:flex;gap:8px}.dot{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.22);border:1px solid rgba(255,216,61,.25);transition:.25s}.dot.on{width:28px;background:var(--gold);box-shadow:0 0 16px rgba(255,216,61,.55)}#controls{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;gap:10px;opacity:0;transition:.2s}.ui #controls{opacity:1}#controls button{border:1px solid #ffffff26;background:#111b;color:#fff;border-radius:999px;padding:10px 16px;font:700 12px Arial;backdrop-filter:blur(10px)}#controls .primary{background:#ffd83d!important;color:#000!important}#hint{position:fixed;right:18px;bottom:22px;z-index:100;color:#ffffff80;font-size:11px;opacity:0;transition:.2s}.ui #hint{opacity:1}.ready{position:fixed;left:18px;bottom:22px;z-index:101;color:#ffd83d;font-size:11px;opacity:0;transition:.3s}.ready.show{opacity:1}#dust{position:absolute;inset:0;width:1920px;height:1080px;z-index:18;pointer-events:none;background:transparent!important;mix-blend-mode:screen}.grain{position:absolute;inset:0;z-index:19;pointer-events:none;opacity:.03;mix-blend-mode:soft-light;background-image:url('data:image/svg+xml,%3Csvg viewBox=%220 0 180 180%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.95%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22 opacity=%22.4%22/%3E%3C/svg%3E');animation:grainFx .28s steps(2) infinite}@keyframes grainFx{0%{transform:translate(0)}50%{transform:translate(-1%,1%)}100%{transform:translate(1%,-1%)}}.wipe{position:absolute;inset:-25% -10%;z-index:50;background:linear-gradient(100deg,transparent 0,rgba(244,179,28,.72) 34%,rgba(255,241,168,.96) 50%,rgba(244,179,28,.72) 66%,transparent 100%);transform:skewX(-12deg) translateX(-130%);pointer-events:none;filter:drop-shadow(0 0 42px rgba(255,216,61,.45))}.wipe.go{animation:wipeFx .88s cubic-bezier(.7,0,.2,1)}@keyframes wipeFx{0%{transform:skewX(-12deg) translateX(-130%)}45%,55%{transform:skewX(-12deg) translateX(0)}100%{transform:skewX(-12deg) translateX(130%)}}.beam{position:absolute;top:-14px;width:8px;height:1120px;border-radius:999px;z-index:16;opacity:0;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,235,150,0),rgba(255,221,95,1) 10%,rgba(255,246,206,1) 48%,rgba(255,214,58,1) 84%,rgba(255,221,95,0));box-shadow:0 0 14px rgba(255,207,52,.95),0 0 36px rgba(255,178,0,.8),0 0 92px rgba(255,178,0,.43),0 0 160px rgba(255,178,0,.15);mix-blend-mode:screen}.beam.left{left:585px;transform:rotate(15.8deg) scaleY(.03)}.beam.right{left:1440px;transform:rotate(16.8deg) scaleY(.03)}.active .beam.left{animation:igniteLeftFx 1.05s cubic-bezier(.16,1,.3,1) .05s forwards,pulseFx 2.4s ease-in-out 1.18s infinite}.active .beam.right{animation:igniteRightFx 1.05s cubic-bezier(.16,1,.3,1) .13s forwards,pulseFx 2.4s ease-in-out 1.28s infinite}@keyframes igniteLeftFx{0%{opacity:0;transform:rotate(15.8deg) scaleY(.03)}35%{opacity:1;transform:rotate(15.8deg) scaleY(.5)}70%{opacity:1;transform:rotate(15.8deg) scaleY(1.05)}100%{opacity:.85;transform:rotate(15.8deg) scaleY(1)}}@keyframes igniteRightFx{0%{opacity:0;transform:rotate(16.8deg) scaleY(.03)}35%{opacity:1;transform:rotate(16.8deg) scaleY(.5)}70%{opacity:1;transform:rotate(16.8deg) scaleY(1.05)}100%{opacity:.85;transform:rotate(16.8deg) scaleY(1)}}@keyframes pulseFx{50%{opacity:.6}}.mist{position:absolute;left:0;right:0;bottom:-70px;height:250px;z-index:12;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,rgba(255,189,49,.30),rgba(255,189,49,.13) 34%,transparent 72%);filter:blur(16px);opacity:.8;mix-blend-mode:screen}.active .mist{animation:mistMoveFx 5s ease-in-out infinite}@keyframes mistMoveFx{50%{opacity:.48;transform:translateY(18px)}}.marketSlide{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:56px 64px;background:radial-gradient(circle at 52% 18%,rgba(255,216,61,.12),transparent 30%),linear-gradient(135deg,#050505,#0b0b08 55%,#030303)}.marketInner{width:88%;height:82%;border:1px solid rgba(255,216,61,.24);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.01));box-shadow:0 30px 100px rgba(0,0,0,.68),inset 0 0 60px rgba(255,216,61,.025);padding:46px 52px;position:relative;overflow:hidden}.marketKicker{font-size:18px;letter-spacing:.23em;text-transform:uppercase;color:var(--gold);font-weight:900}.marketTitle{margin-top:10px;font-size:46px;line-height:1;font-weight:900;letter-spacing:-.045em;text-transform:uppercase}.bars{margin-top:34px;display:grid;gap:16px}.bar{display:grid;grid-template-columns:305px minmax(0,1fr) 210px;align-items:center;gap:24px;min-height:58px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.055)}.name{display:flex;align-items:center;gap:16px;font-size:25px;font-weight:900;white-space:nowrap}.logoWrap{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:#111;font-weight:900}.track{height:22px;background:rgba(255,255,255,.11);overflow:hidden;border-radius:999px;border:1px solid rgba(255,255,255,.07)}.fill{height:100%;background:linear-gradient(90deg,#ffe052,#ffd12f,#f4b31c);box-shadow:0 0 18px rgba(255,216,61,.32);transform-origin:left}.active .fill{animation:grow 1s cubic-bezier(.16,1,.3,1) forwards}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}.val{justify-self:start;font-size:16px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.74);font-weight:800;white-space:nowrap;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.035)}.lunchSlide{position:absolute;inset:0;z-index:2;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(255,216,61,.12),transparent 30%),radial-gradient(circle at 12% 78%,rgba(244,179,28,.11),transparent 24%),linear-gradient(180deg,#030303 0%,#080705 50%,#020202 100%);display:flex;align-items:center;justify-content:center}.lunchSlide:before{content:"";position:absolute;inset:0;background:linear-gradient(118deg,transparent 0 13%,rgba(255,216,61,.30) 13.4%,transparent 14.3% 85%,rgba(255,216,61,.30) 86%,transparent 87%),radial-gradient(ellipse at 50% 100%,rgba(255,190,49,.18),transparent 55%);pointer-events:none}.lunchSlide:after{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,216,61,.55) 0 1px,transparent 1.5px);background-size:78px 78px;opacity:.13;pointer-events:none}.lunchWrap{position:relative;z-index:2;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 110px 100px}.lunchTitle{font-size:86px;line-height:.94;font-weight:900;text-transform:uppercase;letter-spacing:-.045em;text-align:center;color:#f8f3e9;text-shadow:0 10px 34px rgba(0,0,0,.65);white-space:nowrap}.lunchTitle span{color:var(--gold);text-shadow:0 0 28px rgba(255,216,61,.22)}.lunchTimerBox{margin-top:48px;min-width:900px;padding:34px 66px 39px;border-radius:34px;border:2px solid rgba(255,216,61,.38);background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(18,14,8,.92));box-shadow:0 0 0 1px rgba(255,216,61,.08) inset,0 0 40px rgba(255,216,61,.18),inset 0 0 45px rgba(255,216,61,.06);display:flex;align-items:center;justify-content:center}.lunchTimer{font-size:150px;line-height:1;font-weight:900;letter-spacing:.02em;color:var(--gold);text-shadow:0 0 24px rgba(255,216,61,.24);font-variant-numeric:tabular-nums}.lunchSub{margin-top:38px;font-size:42px;line-height:1.12;color:#f3f3f3;text-align:center;letter-spacing:.04em}.lunchReturn{margin-top:18px;font-size:24px;color:rgba(255,216,61,.86);font-weight:800;letter-spacing:.10em;text-transform:uppercase}.lunchBrand{position:absolute;bottom:66px;left:50%;transform:translateX(-50%);text-align:center;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-size:22px}.lunchBrand small{display:block;color:#ffffffc9;letter-spacing:.42em;font-size:13px;margin-bottom:8px}.lunchHelp{position:absolute;right:66px;bottom:78px;font-size:15px;color:#ffffff55;letter-spacing:.12em;text-transform:uppercase}.slide[data-kind="lunch"] .slideName,.slide[data-kind="lunch"] .slideNo{display:none}
</style>
</head>
<body>
<div id="viewport"><div id="stage"><canvas id="dust" width="1920" height="1080"></canvas><div id="slides"></div><div class="grain"></div><div class="wipe" id="wipe"></div><div class="progress" id="progress"></div><div class="dots" id="dots"></div></div></div>
<div id="controls"><button id="prev">◀ Voltar</button><button class="primary" id="full">Tela cheia</button><button id="next">Avançar ▶</button></div><div id="hint">← → / espaço • F tela cheia • R efeito • L reinicia almoço</div><div id="ready" class="ready">v7 • offline pronto</div>
<script>
const VERSION='v8-final-qr-pix';
const SLIDES=[
{src:'assets/1.jpg',kind:'opening',label:'abertura'},
{src:'assets/2.jpg',kind:'image',label:'imersão'},
{src:'assets/3.jpg',kind:'image',label:'imersão'},
{src:'assets/4.jpg',kind:'image',label:'imersão'},
{src:'assets/5.jpg',kind:'image',label:'imersão'},
{src:'assets/6.jpg',kind:'image',label:'formas de vender online'},
{src:null,kind:'market',label:'marketplaces'},
{src:'assets/16.jpg',kind:'image',label:'mercado livre'},
{src:'assets/9.jpg',kind:'image',label:'imersão'},
{src:'assets/10.jpg',kind:'image',label:'imersão'},
{src:'assets/11.jpg',kind:'image',label:'desenvolvimento de produto'},
{src:'assets/12.jpg',kind:'image',label:'tvx'},
{src:null,kind:'lunch',label:'almoço'},
{src:'assets/14.jpg',kind:'image',label:'patrocinador'},
{src:'assets/7.jpg',kind:'image',label:'importação'},
{src:'assets/8.jpg',kind:'image',label:'importação'},
{src:'assets/15.jpg',kind:'image',label:'argo'},
{src:'assets/62c967bd-f9ee-431b-8196-d00fcce24538.png',kind:'image',label:'formulário'},
{src:'assets/18.jpg',kind:'image',label:'imersão'},
{src:'assets/Apresentação A - Gui Nonato (16).jpg',kind:'closing',label:'mentoria'},
{src:'assets/Apresentação A - Gui Nonato (19).jpg',kind:'image',label:'inscrição'}
];
const marketHTML=`<div class='marketSlide'><div class='marketInner'><div class='marketKicker'>Principais marketplaces do Brasil</div><div class='marketTitle'>Comparativo de faturamento geral</div><div class='bars'><div class='bar'><div class='name'><span class='logoWrap'>ML</span><span>Mercado Livre</span></div><div class='track'><div class='fill' style='width:100%'></div></div><div class='val'>Referência</div></div><div class='bar'><div class='name'><span class='logoWrap'>S</span><span>Shopee</span></div><div class='track'><div class='fill' style='width:72%'></div></div><div class='val'>Alto volume</div></div><div class='bar'><div class='name'><span class='logoWrap'>A</span><span>Amazon</span></div><div class='track'><div class='fill' style='width:58%'></div></div><div class='val'>Crescimento</div></div><div class='bar'><div class='name'><span class='logoWrap'>M</span><span>Magalu</span></div><div class='track'><div class='fill' style='width:42%'></div></div><div class='val'>Varejo + marketplace</div></div><div class='bar'><div class='name'><span class='logoWrap'>TT</span><span>TikTok Shop</span></div><div class='track'><div class='fill' style='width:30%'></div></div><div class='val'>Forte crescimento</div></div></div></div></div>`;
const LUNCH_DURATION=60*60;let lunchEndAt=null,lunchTimerInterval=null;
const lunchHTML=`<div class='lunchSlide'><div class='lunchWrap'><div class='lunchTitle'>PAUSA PARA O <span>ALMOÇO</span></div><div class='lunchTimerBox'><div class='lunchTimer' id='lunchTimer'>01:00:00</div></div><div class='lunchSub' id='lunchSub'>Retornamos em 1 hora</div><div class='lunchReturn' id='lunchReturn'></div><div class='lunchBrand'><small>IMERSÃO</small>ECOMMERCE</div><div class='lunchHelp'>tecla L reinicia</div></div></div>`;
function formatTime(t){const h=String(Math.floor(t/3600)).padStart(2,'0'),m=String(Math.floor((t%3600)/60)).padStart(2,'0'),s=String(t%60).padStart(2,'0');return `${h}:${m}:${s}`}
function human(t){const h=Math.floor(t/3600),m=Math.floor((t%3600)/60);if(h>0&&m>0)return `Retornamos em ${h} hora e ${m} minutos`;if(h>0)return `Retornamos em ${h} hora`;if(m>0)return `Retornamos em ${m} minutos`;return 'Estamos voltando'}
function updateLunchTimer(){if(!lunchEndAt)return;const left=Math.max(0,Math.ceil((lunchEndAt-Date.now())/1000));const timer=document.getElementById('lunchTimer'),sub=document.getElementById('lunchSub'),ret=document.getElementById('lunchReturn');if(timer)timer.textContent=formatTime(left);if(sub)sub.textContent=left>0?human(left):'Estamos voltando';if(ret){const d=new Date(lunchEndAt);ret.textContent=left>0?'RETORNO PREVISTO: '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'RETORNO AGORA'}if(left<=0&&lunchTimerInterval){clearInterval(lunchTimerInterval);lunchTimerInterval=null}}
function startLunchTimer(reset=false){if(reset||!lunchEndAt)lunchEndAt=Date.now()+LUNCH_DURATION*1000;updateLunchTimer();if(lunchTimerInterval)clearInterval(lunchTimerInterval);lunchTimerInterval=setInterval(updateLunchTimer,1000)}
function slideContent(s,i){if(s.kind==='market')return marketHTML;if(s.kind==='lunch')return lunchHTML;const url=s.src+'?v='+VERSION;return `<div class='imageSlide' data-bg='${url}'><div class='imageBack'></div><img class='slide-img' src='${url}' alt='Slide ${i+1}' loading='${i<3?'eager':'lazy'}' decoding='sync'></div>`}
const wrap=document.getElementById('slides'),dots=document.getElementById('dots');
wrap.innerHTML=SLIDES.map((s,i)=>`<section class='slide ${i===0?'active':''}' data-kind='${s.kind}'>${slideContent(s,i)}<div class='cornerGlow'></div><div class='frame'></div>${i===0?"<div class='mist'></div><div class='beam left'></div><div class='beam right'></div>":''}<div class='slideName'>${s.label}</div><div class='slideNo'>${String(i+1).padStart(2,'0')}</div></section>`).join('');
document.querySelectorAll('.imageSlide').forEach(el=>{el.querySelector('.imageBack').style.backgroundImage=`url('${el.dataset.bg}')`});
dots.innerHTML=SLIDES.map((_,i)=>`<span class='dot ${i===0?'on':''}'></span>`).join('');
const slides=[...document.querySelectorAll('.slide')],dotEls=[...document.querySelectorAll('.dot')],stage=document.getElementById('stage'),progress=document.getElementById('progress'),wipe=document.getElementById('wipe');let idx=0,uiTimer,busy=false;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
function showUI(){document.body.classList.add('ui');clearTimeout(uiTimer);uiTimer=setTimeout(()=>document.body.classList.remove('ui'),1800)}addEventListener('mousemove',showUI);showUI();
function restartFx(slide){slide.querySelectorAll('.beam,.mist,.fill,.slide-img').forEach(el=>{el.style.animation='none';void el.offsetHeight;el.style.animation=''})}
function afterSlide(){progress.style.width=((idx+1)/slides.length*100)+'%';restartFx(slides[idx]);if(SLIDES[idx].kind==='lunch')startLunchTimer(false)}
function go(n,force=false){n=Math.max(0,Math.min(slides.length-1,n));if((n===idx&&!force)||busy)return;busy=true;wipe.classList.remove('go');void wipe.offsetWidth;wipe.classList.add('go');setTimeout(()=>{slides[idx].classList.remove('active');dotEls[idx].classList.remove('on');idx=n;slides[idx].classList.add('active');dotEls[idx].classList.add('on');afterSlide()},315);setTimeout(()=>{busy=false},900)}
progress.style.width=(1/slides.length*100)+'%';document.getElementById('next').onclick=()=>go(idx+1);document.getElementById('prev').onclick=()=>go(idx-1);document.getElementById('full').onclick=()=>document.documentElement.requestFullscreen?.();
addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(idx-1)}if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='r')go(idx,true);if(e.key.toLowerCase()==='l')startLunchTimer(true)});
const canvas=document.getElementById('dust'),ctx=canvas.getContext('2d');const pts=Array.from({length:240},()=>({x:Math.random()*1920,y:Math.random()*1080,r:.6+Math.random()*2.5,v:.22+Math.random()*.62,dx:(Math.random()-.5)*.26,a:.05+Math.random()*.25}));
(function dustLoop(){ctx.clearRect(0,0,1920,1080);if(idx===0){for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1092){p.y=-16;p.x=Math.random()*1920;p.dx=(Math.random()-.5)*.26}if(p.x<-25)p.x=1945;if(p.x>1945)p.x=-25;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,220,115,${p.a*1.55})`;ctx.fill()}}requestAnimationFrame(dustLoop)})();
restartFx(slides[0]);
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js?v='+VERSION,{updateViaCache:'none'}).then(reg=>{reg.update();document.getElementById('ready').classList.add('show');setTimeout(()=>document.getElementById('ready').classList.remove('show'),2800);}).catch(()=>{});}
</script>
</body>
</html>
