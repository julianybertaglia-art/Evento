<style>
:root{--y:#f4c51d;--y2:#ffe05a;--bg:#050606}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,Arial,sans-serif}#viewport{position:fixed;inset:0;background:#000;overflow:hidden}#stage{position:absolute;left:50%;top:50%;width:3300px;height:1080px;transform-origin:center center;background:#050606;overflow:hidden}#stage:before{content:"";position:absolute;inset:0;z-index:80;pointer-events:none;background:radial-gradient(circle at 50% 45%,transparent 44%,rgba(0,0,0,.38) 100%);box-shadow:inset 0 0 170px rgba(0,0,0,.78)}.side{position:absolute;top:0;width:930px;height:1080px;overflow:hidden}.left{left:0}.right{right:0}.side img{width:100%;height:100%;object-fit:cover;filter:brightness(.52) saturate(.72) contrast(1.03);animation:drift 14s ease-in-out infinite alternate}.right img{animation-delay:-5s}@keyframes drift{from{transform:scale(1.02) translateX(-10px)}to{transform:scale(1.065) translateX(18px)}}.center{position:absolute;left:760px;right:760px;top:0;bottom:0;background:radial-gradient(circle at 50% 44%,rgba(244,197,29,.14),transparent 47%),#050606;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:4}.kicker{font-size:34px;font-weight:800;letter-spacing:.23em;text-transform:uppercase;color:var(--y2);opacity:0;animation:reveal .8s cubic-bezier(.16,1,.3,1) .08s forwards}.title{margin:34px 0 0;font-size:178px;line-height:.88;letter-spacing:-.065em;font-weight:900;text-transform:uppercase;opacity:0;filter:blur(10px);transform:translateY(36px);animation:reveal .9s cubic-bezier(.16,1,.3,1) .18s forwards}.title span{color:var(--y2)}.tagline{margin-top:30px;font-size:44px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:0;animation:reveal .8s cubic-bezier(.16,1,.3,1) .36s forwards}.tagline span{color:var(--y2)}.meta{margin-top:52px;font-size:28px;font-weight:700;letter-spacing:.18em;color:#ffffff90;text-transform:uppercase;opacity:0;animation:reveal .8s cubic-bezier(.16,1,.3,1) .52s forwards}@keyframes reveal{to{opacity:1;filter:none;transform:none}}.beam{position:absolute;width:4px;height:920px;top:80px;background:linear-gradient(180deg,rgba(255,216,61,0),rgba(255,216,61,.96) 16%,rgba(255,216,61,.98) 50%,rgba(255,216,61,0));box-shadow:0 0 26px #f7ba16;opacity:0;z-index:5;transform-origin:50% 0}.beam:before{content:"";position:absolute;left:50%;top:-18px;width:34px;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,242,178,.95) 0,rgba(255,219,94,.85) 35%,rgba(255,216,61,0) 72%);filter:blur(1px);opacity:0}.beam:after{content:"";position:absolute;left:50%;top:0;width:18px;height:180px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,245,190,.95),rgba(255,216,61,.52),rgba(255,216,61,0));filter:blur(5px);opacity:0}.beam.a{left:940px;transform:rotate(3deg) scaleY(.08);animation:beamIgniteA 1.3s cubic-bezier(.16,1,.3,1) forwards,beamPulse 2.8s ease-in-out 1.35s infinite}.beam.b{right:940px;transform:rotate(-3deg) scaleY(.08);animation:beamIgniteB 1.3s cubic-bezier(.16,1,.3,1) .12s forwards,beamPulse 2.8s ease-in-out 1.47s infinite}.beam.a:before,.beam.b:before{animation:beamHead 1.15s ease-out .15s forwards}.beam.a:after,.beam.b:after{animation:beamTail 1s ease-out .22s forwards}@keyframes beamIgniteA{0%{opacity:0;transform:rotate(3deg) scaleY(.08)}35%{opacity:.95;transform:rotate(3deg) scaleY(.38)}68%{opacity:1;transform:rotate(3deg) scaleY(1.02)}100%{opacity:.84;transform:rotate(3deg) scaleY(1)}}@keyframes beamIgniteB{0%{opacity:0;transform:rotate(-3deg) scaleY(.08)}35%{opacity:.95;transform:rotate(-3deg) scaleY(.38)}68%{opacity:1;transform:rotate(-3deg) scaleY(1.02)}100%{opacity:.84;transform:rotate(-3deg) scaleY(1)}}@keyframes beamHead{0%{opacity:0;transform:translateX(-50%) scale(.5)}22%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1.65)}}@keyframes beamTail{0%{opacity:0;height:20px}20%{opacity:.95}100%{opacity:0;height:280px}}@keyframes beamPulse{50%{opacity:1;box-shadow:0 0 55px #ffc928,0 0 100px rgba(255,201,40,.34)}}#dust{position:absolute;inset:0;z-index:75;pointer-events:none;opacity:.58}.slideDust{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}.dust{position:absolute;top:-120px;width:4px;height:4px;border-radius:50%;background:rgba(255,222,115,.92);box-shadow:0 0 14px rgba(255,209,80,.75),0 0 28px rgba(255,200,20,.32);opacity:0;animation:slideDustFall linear infinite}.dust.s1{left:17%;animation-duration:7.8s;animation-delay:.1s;transform:scale(1.3)}.dust.s2{left:24%;animation-duration:10.2s;animation-delay:1.8s;transform:scale(.9)}.dust.s3{left:31%;animation-duration:8.9s;animation-delay:3.2s;transform:scale(1.1)}.dust.s4{left:42%;animation-duration:11.8s;animation-delay:.7s;transform:scale(.8)}.dust.s5{left:58%;animation-duration:9.6s;animation-delay:2.9s;transform:scale(1.4)}.dust.s6{left:69%;animation-duration:12.4s;animation-delay:1.1s;transform:scale(1)}.dust.s7{left:76%;animation-duration:8.4s;animation-delay:4.2s;transform:scale(.95)}.dust.s8{left:84%;animation-duration:10.8s;animation-delay:2.1s;transform:scale(1.2)}.dust.s9{left:48%;animation-duration:13.2s;animation-delay:5.1s;transform:scale(.75)}.dust.s10{left:54%;animation-duration:9.9s;animation-delay:6.2s;transform:scale(1.05)}@keyframes slideDustFall{0%{transform:translate3d(0,-40px,0);opacity:0}8%{opacity:.8}85%{opacity:.55}100%{transform:translate3d(-35px,1220px,0);opacity:0}}.grain{position:absolute;inset:0;z-index:70;pointer-events:none;opacity:.12;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");animation:grain .25s steps(2) infinite}.vignette{position:absolute;inset:0;z-index:69;pointer-events:none;box-shadow:inset 0 0 220px 70px rgba(0,0,0,.78)}@keyframes grain{0%{transform:translate(0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(-2%,-1%)}}.note{position:fixed;right:18px;bottom:16px;z-index:100;color:#ffffff60;font:700 12px Inter;letter-spacing:.08em}button{position:fixed;left:18px;bottom:16px;z-index:100;border:1px solid #ffffff26;background:#111a;color:#fff;border-radius:999px;padding:11px 18px;font:800 12px Inter;letter-spacing:.06em}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
<canvas id="dust" width="3300" height="1080"></canvas>
<div class="side left"><img src="/images/operation.jpg" alt=""></div>
<div class="side right"><img src="/images/audience.jpg" alt=""></div>
<div class="center"><div class="kicker">26.09 • São Paulo</div><h1 class="title">IMERSÃO<br><span>ECOMMERCE</span></h1><div class="tagline">Mercado Livre <span>PRO</span></div><div class="meta">@gui_nonato</div></div>
<div class="slideDust"><span class="dust s1"></span><span class="dust s2"></span><span class="dust s3"></span><span class="dust s4"></span><span class="dust s5"></span><span class="dust s6"></span><span class="dust s7"></span><span class="dust s8"></span><span class="dust s9"></span><span class="dust s10"></span></div>
<div class="beam a"></div><div class="beam b"></div><div class="grain"></div><div class="vignette"></div>
</div></div><button onclick="location.reload()">REVER EFEITO</button><div class="note">Prévia do Slide 1 • F para tela cheia</div>
<script>
const stage=document.getElementById('stage');function fit(){const s=Math.min(innerWidth/3300,innerHeight/1080);stage.style.transform='translate(-50%,-50%) scale('+s+')'}addEventListener('resize',fit);fit();addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.();if(e.key.toLowerCase()==='r')location.reload()});
const c=document.getElementById('dust'),ctx=c.getContext('2d');const pts=Array.from({length:120},()=>({x:Math.random()*3300,y:Math.random()*1080,r:.7+Math.random()*2.4,v:.12+Math.random()*.34,dx:(Math.random()-.5)*.18,a:.04+Math.random()*.22}));
(function particles(){ctx.clearRect(0,0,3300,1080);for(const p of pts){p.y+=p.v;p.x+=p.dx;if(p.y>1095||p.x<-20||p.x>3320){p.y=-20;p.x=Math.random()*3300;p.dx=(Math.random()-.5)*.18}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(255,220,110,'+p.a+')';ctx.fill()}requestAnimationFrame(particles)})();
</script>
</body></html>
