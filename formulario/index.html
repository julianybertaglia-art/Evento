<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Imersão Ecommerce — Formulário</title><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:680px;margin:auto;padding:28px 18px 60px}.brand{color:#ffd83d;font-weight:900;letter-spacing:.12em;font-size:13px}.card{margin-top:16px;background:#121212;border:1px solid #2b2b2b;border-radius:24px;padding:22px}h1{font-size:31px;line-height:1.02;margin:8px 0 10px}p{color:#bbb;line-height:1.45}.grid{display:grid;gap:14px;margin-top:20px}label{font-size:13px;font-weight:800;color:#ddd;display:grid;gap:7px}input,select,textarea{width:100%;border:1px solid #3a3a3a;background:#0b0b0b;color:#fff;border-radius:13px;padding:14px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:#ffd83d}textarea{min-height:88px;resize:vertical}.req{color:#ffd83d}button{width:100%;border:0;border-radius:14px;background:#ffd83d;color:#000;font-weight:900;font-size:16px;padding:16px;margin-top:8px;cursor:pointer}.small{font-size:12px;color:#888;text-align:center}.ok{display:none;text-align:center;padding:34px 10px}.check{font-size:58px}.ok h2{font-size:28px;margin:10px 0}.error{display:none;color:#ffb4b4;background:#321414;border:1px solid #6b2929;border-radius:12px;padding:11px 13px;margin-top:12px}
</style></head><body><main class="wrap"><div class="brand">IMERSÃO ECOMMERCE</div><div class="card" id="formCard"><h1>Formulário + sorteio 🎁</h1><p>Preencha em menos de 1 minuto. Ao enviar, você participa automaticamente dos sorteios de hoje.</p><form id="f"><div class="grid">
<label>Nome completo <span class="req">*</span><input name="nome" required autocomplete="name"></label>
<label>WhatsApp <span class="req">*</span><input name="whatsapp" required inputmode="tel" autocomplete="tel" placeholder="(11) 99999-9999"></label>
<label>Em que estágio você está?<select name="estagio"><option value="">Selecione</option><option>Ainda não vendo</option><option>Começando agora</option><option>Já vendo em marketplace</option><option>Operação estruturada</option></select></label>
<label>Faturamento mensal aproximado<select name="faturamento"><option value="">Selecione</option><option>Ainda não faturo</option><option>Até R$ 10 mil</option><option>R$ 10 mil a R$ 50 mil</option><option>R$ 50 mil a R$ 100 mil</option><option>R$ 100 mil a R$ 300 mil</option><option>Acima de R$ 300 mil</option></select></label>
<label>Qual seu principal desafio hoje?<textarea name="desafio"></textarea></label>
<label>Qual é seu maior objetivo no ecommerce?<textarea name="objetivo"></textarea></label>
<label>O que você achou da Imersão?<textarea name="opiniao"></textarea></label>
<button id="send" type="submit">ENVIAR E PARTICIPAR DO SORTEIO</button><div id="err" class="error"></div><div class="small">Uma inscrição por WhatsApp.</div>
</div></form></div><div class="card ok" id="ok"><div class="check">✅</div><h2>Cadastro confirmado!</h2><p>Seu nome já está na lista do sorteio. Boa sorte! 🍀</p></div></main>
<script>
const END='https://yjcrjoehpexddzqzafmc.supabase.co/rest/v1/imersao_2026_responses',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InlqY3Jqb2VocGV4ZGR6cXphZm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTA5MjYsImV4cCI6MjEwMTUyNjkyNn0.XS-7oFXQtePV0Wr0pA5UZcHgQdN_l9tGPawC3QzFnSY';const f=document.getElementById('f'),btn=document.getElementById('send'),err=document.getElementById('err');
f.onsubmit=async e=>{e.preventDefault();err.style.display='none';btn.disabled=true;btn.textContent='ENVIANDO...';const x=Object.fromEntries(new FormData(f));x.nome=(x.nome||'').trim();x.whatsapp=(x.whatsapp||'').trim();x.phone_digits=x.whatsapp.replace(/\D/g,'');if(x.nome.length<2||x.phone_digits.length<10){err.textContent='Confira seu nome e WhatsApp.';err.style.display='block';btn.disabled=false;btn.textContent='ENVIAR E PARTICIPAR DO SORTEIO';return}
try{const r=await fetch(END,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(x)});if(r.ok){document.getElementById('formCard').style.display='none';document.getElementById('ok').style.display='block';localStorage.setItem('imersao_form_ok','1');window.scrollTo(0,0)}else if(r.status===409){document.getElementById('formCard').style.display='none';document.getElementById('ok').style.display='block';document.querySelector('#ok h2').textContent='Você já está participando!';window.scrollTo(0,0)}else throw new Error(await r.text())}catch(ex){err.textContent='Não consegui enviar agora. Tente novamente em alguns segundos.';err.style.display='block';btn.disabled=false;btn.textContent='ENVIAR E PARTICIPAR DO SORTEIO'}}
</script></body></html>
