<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layout da Sala — Imersão Ecommerce</title>
<style>
:root{--bg:#09090a;--line:#303037;--text:#f5f5f6;--muted:#a7a7b0;--seller:#f4c542;--iniciante:#5db7ff;--convidado:#c77dff;--acomp:#62d394}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{overflow:auto}
.top{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 16px;background:#0d0d0fee;border-bottom:1px solid #25252a;backdrop-filter:blur(10px)}
.top h1{margin:0;font-size:18px}.top p{margin:3px 0 0;color:#aaa;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button,a{border:1px solid #34343a;background:#1a1a1e;color:#fff;border-radius:10px;padding:10px 13px;font-weight:900;text-decoration:none;cursor:pointer}
.primary{background:#f4c542;color:#111;border-color:#f4c542}
.viewport{padding:18px;overflow:auto}
.canvas-wrap{position:relative;margin:0 auto}
.floor{transform-origin:top left;transition:transform .18s ease}
.zoom-label{min-width:64px;text-align:center;border:1px solid #34343a;background:#111114;border-radius:10px;padding:10px 8px;font-weight:900}
.zoom-btn{min-width:44px;font-size:18px;padding:8px 11px}
.fit-btn{background:#242429}
.floor{position:relative;min-width:1740px;min-height:1410px;padding:18px 30px 40px;background:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px),#0c0c0e;background-size:34px 34px;border:1px solid #222227;border-radius:18px}
.stage{position:relative;margin:0 auto 34px;width:1040px;height:110px;border:2px solid #e9b93a;background:linear-gradient(180deg,#33280d,#181305);border-radius:18px;display:grid;place-items:center;font-size:30px;font-weight:1000;letter-spacing:.12em;color:#ffd85d;box-shadow:0 0 28px #f4c54220}
.stage small{position:absolute;bottom:8px;font-size:10px;letter-spacing:.16em;color:#fff7}
.loose{position:absolute;right:35px;top:25px;width:310px}.loose h3{font-size:12px;text-align:center;color:#bbb;margin:0 0 7px;text-transform:uppercase;letter-spacing:.08em}.loose-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.blocks{display:grid;grid-template-columns:1fr 360px 1fr;gap:42px;align-items:start}.block{display:grid;gap:54px}.middle{padding-top:235px;display:grid;gap:150px}
.table-card{background:#0f0f11;border:1px solid #2e2e34;border-radius:18px;padding:12px;box-shadow:0 12px 30px #0005}
.table-surface{height:76px;border:2px solid #6a5520;background:linear-gradient(180deg,#352a11,#211a0b);border-radius:12px;display:grid;place-items:center;color:#ffd970;font-weight:950;font-size:17px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.seat-row{display:grid;grid-template-columns:repeat(8,minmax(72px,1fr));gap:6px}.small-table .seat-row{grid-template-columns:repeat(2,1fr)}.small-table .table-surface{height:70px}
.seat{min-height:88px;border:1px dashed #494951;background:#161619;border-radius:11px;padding:7px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.seat.empty:after{content:"+";font-size:24px;color:#555}
.person{width:100%;height:100%;min-height:72px;border-radius:10px;padding:7px 6px;border-left:5px solid #555;background:#1a1a1e;display:flex;flex-direction:column;justify-content:center}
.person.seller{border-left-color:var(--seller)}.person.iniciante{border-left-color:var(--iniciante)}.person.convidado{border-left-color:var(--convidado)}.person.acompanhante{border-left-color:var(--acomp)}
.nm{font-weight:950;font-size:13px;line-height:1.12}.meta{font-size:9px;color:#aaa;margin-top:4px}.seat-no{position:absolute;right:5px;top:4px;font-size:8px;color:#666;font-weight:900}
.legend{position:fixed;left:18px;bottom:18px;z-index:20;display:flex;gap:6px;flex-wrap:wrap;background:#101012dd;border:1px solid #2a2a2f;border-radius:12px;padding:8px}.legend span{font-size:10px;font-weight:900;border-radius:999px;padding:6px 8px;color:#111}.legend .seller{background:var(--seller)}.legend .iniciante{background:var(--iniciante)}.legend .convidado{background:var(--convidado)}.legend .acompanhante{background:var(--acomp)}
body.full .top, body.full .legend{display:none}
body.full .viewport{padding:10px}
body.full .floor{border:0;border-radius:0;min-height:100vh}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{background:#fff!important;color:#111!important}
  .top,.legend{display:none!important}
  .viewport{padding:0!important;background:#fff!important;overflow:visible!important}
  .canvas-wrap{width:auto!important;height:auto!important}
  .floor{
    border:0!important;
    border-radius:0!important;
    background:
      linear-gradient(#ececf0 1px,transparent 1px),
      linear-gradient(90deg,#ececf0 1px,transparent 1px),
      #fff!important;
    background-size:34px 34px!important;
    color:#111!important;
    transform:scale(.62)!important;
    transform-origin:top left!important;
  }
  .stage{
    background:#f5dd91!important;
    border-color:#a88628!important;
    color:#3b2b00!important;
    box-shadow:none!important
  }
  .table-card{
    background:#f8f8fa!important;
    border-color:#b9bbc4!important;
    box-shadow:none!important
  }
  .table-surface{
    background:#fff2c8!important;
    border-color:#a88628!important;
    color:#6b520f!important
  }
  .seat{
    background:#fff!important;
    border-color:#bfc1c8!important;
    color:#111!important
  }
  .seat.empty{
    background:#f3f3f5!important
  }
  .person{
    background:#fff!important;
    color:#111!important;
    box-shadow:none!important
  }
  .person.seller{border-left-color:#d4a400!important}
  .person.iniciante{border-left-color:#2d8fd5!important}
  .person.convidado{border-left-color:#9b55cf!important}
  .person.acompanhante{border-left-color:#3ba86f!important}
  .nm{color:#111!important}
  .meta,.seat-no,.stage small{color:#555!important}
  @page{size:A4 landscape;margin:0}
}
</style>
</head>
<body>
<div class="top">
  <div><h1>Layout da sala</h1><p>Somente o mapa com os nomes posicionados.</p></div>
  <div class="actions">
    <a href="../">← Voltar para a lista</a>
    <button class="zoom-btn" id="zoomOut" title="Diminuir zoom">−</button>
    <div class="zoom-label" id="zoomLabel">100%</div>
    <button class="zoom-btn" id="zoomIn" title="Aumentar zoom">+</button>
    <button class="fit-btn" id="fit">Ajustar na tela</button>
    <button class="primary" id="full">⛶ ABRIR EM TELA CHEIA</button>
    <button id="print">Imprimir / PDF</button>
  </div>
</div>
<div class="viewport" id="viewport">
  <div class="canvas-wrap" id="canvasWrap">
  <div class="floor" id="floor">
    <div class="stage">PALCO <small>FRENTE DA SALA</small></div>
    <div class="loose"><h3>6 cadeiras laterais</h3><div id="loose" class="loose-grid"></div></div>
    <div class="blocks"><div id="left" class="block"></div><div id="middle" class="middle"></div><div id="right" class="block"></div></div>
  </div>
  </div>
</div>
<div class="legend"><span class="seller">SELLER</span><span class="iniciante">INICIANTE</span><span class="convidado">CONVIDADO</span><span class="acompanhante">ACOMPANHANTE</span></div>
<script>
const PARTICIPANTS=[{"id":"alex-navarra","name":"Alex Navarra","category":"iniciante","group":"Alex Navarra"},{"id":"daniel-maestrelo","name":"Daniel Maestrelo Acomp.","category":"acompanhante","group":"Alex Navarra"},{"id":"alexander-miura","name":"Alexander Miura","category":"seller"},{"id":"beatriz-campos","name":"Beatriz Campos","category":"seller","group":"Beatriz Campos"},{"id":"camila-palko","name":"Camila Palko","category":"acompanhante","group":"Beatriz Campos"},{"id":"arnaldo-nakamura","name":"Arnaldo Nakamura","category":"seller","group":"Arnaldo Nakamura"},{"id":"william-prundencio","name":"William Prundencio","category":"acompanhante","group":"Arnaldo Nakamura"},{"id":"bruno-fernandes","name":"Bruno Fernandes","category":"seller"},{"id":"carlos-alberto","name":"Carlos Alberto","category":"convidado","group":"Carlos Alberto"},{"id":"lidiane-cavoli","name":"Lidiane Cavoli acom.","category":"acompanhante","group":"Carlos Alberto"},{"id":"cecilia-nkuansambu","name":"Cecília Nkuansambu","category":"seller"},{"id":"claudia-furlan","name":"Claudia Furlan","category":"iniciante","group":"Claudia Furlan"},{"id":"richard-di-cillo","name":"Richard Di Cillo","category":"acompanhante","group":"Claudia Furlan"},{"id":"daiane-silva","name":"Daiane Silva","category":"convidado","group":"Daiane Silva"},{"id":"marcos-silva","name":"Marcos Silva acom.","category":"acompanhante","group":"Daiane Silva"},{"id":"rejane-conceicao","name":"Rejane Conceição acom.","category":"acompanhante","group":"Daiane Silva"},{"id":"diogo-bernado","name":"Diogo Bernado","category":"seller"},{"id":"eduardo-dias","name":"Eduardo Dias (acomp)","category":"acompanhante"},{"id":"edson-buzi","name":"Edson Buzi","category":"seller"},{"id":"eduardo-nunes","name":"Eduardo Nunes","category":"seller","group":"Eduardo Nunes"},{"id":"thiago-de-jesus","name":"Thiago de Jesus","category":"acompanhante","group":"Eduardo Nunes"},{"id":"gabriel-cavalcantti","name":"Gabriel Cavalcantti","category":"convidado","group":"Gabriel Cavalcantti"},{"id":"bruno-acomp","name":"Bruno","category":"acompanhante","group":"Gabriel Cavalcantti"},{"id":"guilherme-sarmento","name":"Guilherme Sarmento","category":"seller"},{"id":"gustavo-palacios","name":"Gustavo Palacios","category":"seller"},{"id":"gustavo-guimaraes","name":"Gustavo Guimarães","category":"iniciante","group":"Gustavo Guimarães"},{"id":"daniela-sousa","name":"Daniela Sousa","category":"acompanhante","group":"Gustavo Guimarães"},{"id":"gustavo-nonato","name":"Gustavo Nonato","category":"convidado","group":"Gustavo Nonato"},{"id":"nicolas-acom","name":"Nicolas Acom.","category":"acompanhante","group":"Gustavo Nonato"},{"id":"pedro-henrique-acom","name":"Pedro Henrique Acom.","category":"acompanhante","group":"Gustavo Nonato"},{"id":"heitor-bastos","name":"Heitor Bastos","category":"iniciante"},{"id":"jacqueline-nascimento","name":"Jacqueline Nascimento","category":"iniciante"},{"id":"luciana-beltrame","name":"Luciana Beltrame","category":"iniciante"},{"id":"carlos-daniel","name":"Carlos Daniel","category":"iniciante"},{"id":"marcos-vinicius","name":"Marcos Vinícius","category":"iniciante"},{"id":"mary-vercosa","name":"Mary Verçosa","category":"iniciante","group":"Mary Verçosa"},{"id":"yasmin-vercosa","name":"Yasmin Verçosa","category":"acompanhante","group":"Mary Verçosa"},{"id":"matheus-moura","name":"Matheus Moura","category":"seller","group":"Matheus Moura"},{"id":"gabrielle-vitoria","name":"Gabrielle Vitória Acom","category":"acompanhante","group":"Matheus Moura"},{"id":"otavio-fukuda","name":"Otavio Augusto Fukuda","category":"convidado"},{"id":"rafael-morais","name":"Rafael Morais","category":"convidado"},{"id":"rafael-quinalha","name":"Rafael Quinalha","category":"seller","group":"Rafael Quinalha"},{"id":"bruno-quinalha","name":"Bruno Quinalha","category":"acompanhante","group":"Rafael Quinalha"},{"id":"renata-dilys","name":"Renata Dilys","category":"seller"},{"id":"robert-vagner","name":"Robert Vagner","category":"convidado","group":"Robert Vagner"},{"id":"bia-robert","name":"Bia (acomp. Robert)","category":"acompanhante","group":"Robert Vagner"},{"id":"rodolfo-sousa","name":"Rodolfo Sousa","category":"iniciante","group":"Rodolfo Sousa"},{"id":"edlayne","name":"Edlayne Acom.","category":"acompanhante","group":"Rodolfo Sousa"},{"id":"rodrigo-oliveira","name":"Rodrigo Oliveira","category":"seller"},{"id":"sebastiao-goncalvez","name":"Sebastião Gonçalvez","category":"seller"},{"id":"thais-macedo","name":"Thais Macedo","category":"seller","group":"Thais Macedo"},{"id":"beatriz-mariano","name":"Beatriz Mariano","category":"acompanhante","group":"Thais Macedo"},{"id":"vitoria-moura","name":"Vitoria Moura","category":"iniciante","group":"Vitoria Moura"},{"id":"francisca-costa","name":"Francisca Costa Fonseca","category":"acompanhante","group":"Vitoria Moura"},{"id":"wennedy-nogueira","name":"Wennedy Nogueira","category":"seller","group":"Wennedy Nogueira"},{"id":"rafael-leony","name":"Rafael Leony Acomp.","category":"acompanhante","group":"Wennedy Nogueira"},{"id":"william-de-jesus","name":"William de Jesus","category":"seller","group":"William de Jesus"},{"id":"getulio-de-jesus","name":"Getúlio de Jesus Acom.","category":"acompanhante","group":"William de Jesus"}];
const TABLES=[
{id:"T1",label:"Mesa 1",size:8,block:"left"},{id:"T2",label:"Mesa 2",size:8,block:"left"},{id:"T3",label:"Mesa 3",size:8,block:"left"},
{id:"T7",label:"Mesa pequena 1",size:2,block:"middle"},{id:"T8",label:"Mesa pequena 2",size:2,block:"middle"},
{id:"T4",label:"Mesa 4",size:8,block:"right"},{id:"T5",label:"Mesa 5",size:8,block:"right"},{id:"T6",label:"Mesa 6",size:8,block:"right"}];
const STORAGE_KEY="imersao_ecommerce_lugares_20260925_v1";
let assignments={};try{assignments=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")||{}}catch(e){}
const byId=new Map(PARTICIPANTS.map(p=>[p.id,p]));
function cat(c){return c==="seller"?"Seller":c==="iniciante"?"Iniciante":c==="convidado"?"Convidado":"Acompanhante"}
function person(p){const d=document.createElement("div");d.className="person "+p.category;d.innerHTML='<div class="nm">'+p.name+'</div><div class="meta">'+cat(p.category)+'</div>';return d}
function seat(id,label){const d=document.createElement("div");d.className="seat";const n=document.createElement("span");n.className="seat-no";n.textContent=label;d.appendChild(n);const p=byId.get(assignments[id]);if(p)d.appendChild(person(p));else d.classList.add("empty");return d}
function render(){
  ["left","middle","right"].forEach(id=>document.getElementById(id).innerHTML="");
  TABLES.forEach(t=>{
    const c=document.createElement("section");c.className="table-card"+(t.size===2?" small-table":"");c.innerHTML='<div class="table-surface">'+t.label+'</div>';
    const r=document.createElement("div");r.className="seat-row";
    for(let i=1;i<=t.size;i++)r.appendChild(seat(t.id+"S"+i,(t.size===2?"MP":"M"+t.id.slice(1))+" · "+i));
    c.appendChild(r);document.getElementById(t.block).appendChild(c);
  });
  const l=document.getElementById("loose");l.innerHTML="";for(let i=1;i<=6;i++)l.appendChild(seat("C"+i,"Lateral "+i));
}
render();

const floor=document.getElementById("floor");
const canvasWrap=document.getElementById("canvasWrap");
const viewport=document.getElementById("viewport");
const zoomLabel=document.getElementById("zoomLabel");
let scale=1;
let autoFit=true;
const BASE_W=1740, BASE_H=1410;

function applyScale(next){
  scale=Math.max(.32,Math.min(1.35,next));
  floor.style.transform="scale("+scale+")";
  canvasWrap.style.width=(BASE_W*scale)+"px";
  canvasWrap.style.height=(BASE_H*scale)+"px";
  zoomLabel.textContent=Math.round(scale*100)+"%";
}

function fitToScreen(){
  const top=document.querySelector(".top");
  const topH=(top && getComputedStyle(top).display!=="none")?top.getBoundingClientRect().height:0;
  const pad=22;
  const availW=Math.max(320,window.innerWidth-pad);
  const availH=Math.max(280,window.innerHeight-topH-pad);
  autoFit=true;
  applyScale(Math.min(availW/BASE_W,availH/BASE_H,1));
  viewport.scrollTo({left:0,top:0});
}

document.getElementById("zoomOut").onclick=()=>{autoFit=false;applyScale(scale-.08)};
document.getElementById("zoomIn").onclick=()=>{autoFit=false;applyScale(scale+.08)};
document.getElementById("fit").onclick=fitToScreen;
window.addEventListener("resize",()=>{if(autoFit)fitToScreen()});
fitToScreen();

document.getElementById("print").onclick=()=>window.print();
document.getElementById("full").onclick=async()=>{
  try{
    if(!document.fullscreenElement){await document.documentElement.requestFullscreen();document.body.classList.add("full");}
    else{await document.exitFullscreen();document.body.classList.remove("full");}
  }catch(e){document.body.classList.toggle("full");}
  setTimeout(fitToScreen,120);
};
document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement)document.body.classList.remove("full");
  setTimeout(fitToScreen,120);
});
</script>
</body>
</html>
