<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Imersão — Sorteio</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.brand{color:#ffd83d;font-weight:900;letter-spacing:.12em}.count{font-size:38px;font-weight:900}.muted{color:#999}.card{background:#121212;border:1px solid #2a2a2a;border-radius:20px;padding:20px;margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid #444;background:#171717;color:#fff;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}.primary{background:#ffd83d;color:#000;border-color:#ffd83d}.danger{background:#321414}.list{margin-top:14px;max-height:340px;overflow:auto}.row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #252525}.won{color:#ffd83d}.gate{max-width:440px;margin:15vh auto;padding:26px;background:#121212;border:1px solid #333;border-radius:22px;text-align:center}.gate input{width:100%;padding:14px;border-radius:12px;border:1px solid #444;background:#080808;color:#fff;font-size:18px;margin:10px 0}.draw{position:fixed;inset:0;background:#000;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}.draw .prize{color:#ffd83d;font-weight:900;letter-spacing:.14em;font-size:22px}.draw .name{font-size:72px;font-weight:900;margin-top:24px;line-height:1}.draw .sub{font-size:24px;color:#bbb;margin-top:18px}.draw .close{margin-top:40px}.history{display:grid;gap:8px}.hist{padding:10px 0;border-bottom:1px solid #252525}
</style></head><body><div id="gate" class="gate"><div class="brand">ÁREA DA ORGANIZAÇÃO</div><h1>Sorteio da Imersão</h1><p class="muted">Digite o PIN da organização.</p><input id="pin" type="password" placeholder="PIN"><button class="primary" id="enter">ENTRAR</button><p id="gateErr" style="color:#ffb4b4"></p></div>
<main id="app" class="wrap" style="display:none"><div class="top"><div><div class="brand">IMERSÃO ECOMMERCE</div><h1>Sorteio ao vivo</h1></div><div><div class="count" id="count">0</div><div class="muted">participantes</div></div></div>
<div class="card"><div class="actions"><button class="primary" data-prize="ARGO">🎁 Sortear ARGO</button><button class="primary" data-prize="MESA FECHADA">🏆 Sortear MESA FECHADA</button><button id="reload">Atualizar lista</button><button class="danger" id="undo">Desfazer último sorteio</button></div></div>
<div class="card"><h2>Participantes</h2><div id="list" class="list"></div></div><div class="card"><h2>Sorteios realizados</h2><div id="history" class="history"></div></div></main>
<div id="draw" class="draw"><div><div class="prize" id="drawPrize"></div><div class="name" id="drawName">...</div><div class="sub" id="drawSub"></div><button class="close" id="close">Fechar</button></div></div>
<script>
const B='https://yjcrjoehpexddzqzafmc.supabase.co/rest/v1',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6InlqY3Jqb2VocGV4ZGR6cXphZm1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTA5MjYsImV4cCI6MjEwMTUyNjkyNn0.XS-7oFXQtePV0Wr0pA5UZcHgQdN_l9tGPawC3QzFnSY';let PIN='',entries=[],draws=[];const H=()=>({apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json','X-Client-Info':PIN,Prefer:'return=minimal'});
async function j(url,opt={}){const r=await fetch(url,{...opt,headers:{...H(),...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());if(r.status===204)return null;return await r.json()}
async function load(){entries=await j(B+'/imersao_2026_responses?select=id,nome,whatsapp,drawn_prize,created_at&order=created_at.asc');draws=await j(B+'/imersao_2026_draws?select=*&order=id.asc');count.textContent=entries.length;list.innerHTML=entries.map(x=>'<div class="row"><div>'+esc(x.nome)+'</div><div class="'+(x.drawn_prize?'won':'muted')+'">'+(x.drawn_prize?'GANHOU '+esc(x.drawn_prize):'✓')+'</div></div>').join('')||'<div class="muted">Ainda ninguém respondeu.</div>';history.innerHTML=draws.map(x=>'<div class="hist"><b>'+esc(x.prize)+'</b> — '+esc(x.nome)+'</div>').join('')||'<div class="muted">Nenhum sorteio realizado.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
enter.onclick=async()=>{PIN=pin.value.trim();gateErr.textContent='';try{await load();gate.style.display='none';app.style.display='block'}catch(e){gateErr.textContent='PIN incorreto ou falha de conexão.'}}
reload.onclick=load;
document.querySelectorAll('[data-prize]').forEach(b=>b.onclick=()=>drawWinner(b.dataset.prize));
async function drawWinner(prize){await load();const eligible=entries.filter(x=>!x.drawn_prize);if(!eligible.length){alert('Não há participantes disponíveis.');return}draw.style.display='flex';drawPrize.textContent='SORTEIO — '+prize;let n=0,t=setInterval(()=>{drawName.textContent=eligible[n++%eligible.length].nome},80);await new Promise(r=>setTimeout(r,2200));clearInterval(t);const a=new Uint32Array(1);crypto.getRandomValues(a);const w=eligible[a[0]%eligible.length];drawName.textContent=w.nome;drawSub.textContent='PARABÉNS!';const up=await fetch(B+'/imersao_2026_responses?id=eq.'+encodeURIComponent(w.id),{method:'PATCH',headers:H(),body:JSON.stringify({drawn_prize:prize})});if(!up.ok){alert('Erro ao salvar vencedor.');return}const ins=await fetch(B+'/imersao_2026_draws',{method:'POST',headers:H(),body:JSON.stringify({prize:prize,response_id:w.id,nome:w.nome,whatsapp:w.whatsapp})});if(!ins.ok){alert('Erro ao registrar sorteio.');return}await load()}
close.onclick=()=>draw.style.display='none';
undo.onclick=async()=>{if(!draws.length){alert('Nenhum sorteio para desfazer.');return}const last=draws[draws.length-1];if(!confirm('Desfazer o último sorteio ('+last.prize+' — '+last.nome+')?'))return;await fetch(B+'/imersao_2026_responses?id=eq.'+encodeURIComponent(last.response_id),{method:'PATCH',headers:H(),body:JSON.stringify({drawn_prize:null})});await fetch(B+'/imersao_2026_draws?id=eq.'+encodeURIComponent(last.id),{method:'DELETE',headers:H()});await load()}
</script></body></html>
